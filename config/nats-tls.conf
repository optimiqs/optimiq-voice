# The TLS overlay for `config/nats.conf`.
#
# Run the broker with THIS file instead of `nats.conf` and the client port serves TLS:
#
#   ./config/certs/generate-dev-certs.sh
#   docker compose -f compose.yaml -f compose.dev.yaml -f compose.tls.yaml up nats -d
#
# `include` is nats-server's own directive and resolves relative to the INCLUDING file's directory,
# so both files have to sit in the same mounted directory — which they do: compose mounts each at
# `/etc/nats/`.
#
# WHY AN OVERLAY AND NOT A `tls` BLOCK IN nats.conf
# -------------------------------------------------
# Three mechanisms were available and two of them are worse.
#
#   1. A `tls` block in `nats.conf` guarded by nothing. The broker then refuses to start on any
#      checkout that has not run the certificate script — which is every fresh clone, and every CI
#      job. `pnpm start:services` would fail with a file-not-found on a path nobody has heard of.
#
#   2. A `tls` block whose paths come from `$NATS_TLS_CERT` and friends. nats-server resolves
#      `$NAME` out of the environment, but an UNRESOLVED reference is a hard startup error, so this
#      is mechanism 1 with more variables: the certificate paths become as mandatory as the
#      passwords. There is no conditional in the config language to make a block optional.
#
#   3. This. The file that carries the `tls` block is a SEPARATE file, selected by the `-c` flag,
#      which compose already sets. A stack that wants TLS adds one overlay to the compose
#      invocation; a stack that does not is byte-for-byte unaffected and never opens a certificate
#      path. The two configurations cannot half-apply, because selecting the config file is a
#      single atomic choice.
#
# The client side matches this shape: `NATS_TLS_CA` / `NATS_TLS_ENABLED` default to OFF in every
# client (`packages/config/src/nats-credentials.ts`, `apps/mediad/internal/config`,
# `apps/sipd/internal/config`), so plaintext `nats://` local development keeps working with no
# variables set at all, and turning TLS on is one variable on each side.

include "nats.conf"

tls {
  # The broker's own certificate and key. Mounted read-only by `compose.tls.yaml` from
  # `config/certs/`, which is gitignored — the files are generated, never committed.
  cert_file: "/etc/nats/certs/server.pem"
  key_file: "/etc/nats/certs/server-key.pem"

  # The CA clients' certificates would be verified against. Present so that turning `verify` on is
  # a one-word change rather than a new mount.
  ca_file: "/etc/nats/certs/ca.pem"

  # MUTUAL TLS IS OFF.
  #
  # `verify: true` would require every client to present a certificate signed by the CA above,
  # which is a second credential distribution problem on top of the per-user passwords — and the
  # passwords are what carry AUTHORIZATION here (see the permission sets in `nats.conf`), so a
  # client certificate would authenticate a connection the password already authenticates. TLS's
  # job in this deployment is confidentiality and server identity: it stops the SIP password
  # derivations on `rpc.sip.v1.credential` and every tenant's call metadata from crossing the
  # network in the clear, and it stops a client from being talked into connecting to something
  # that is not the broker.
  #
  # Turn it on for a deployment that already issues client certificates; nothing else here changes.
  verify: false

  # How long the handshake may take. The default is 0.5s, which is fine on a loopback and tight
  # across a congested network on a cold connection.
  timeout: 5
}
