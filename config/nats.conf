# NATS server configuration for the Optimiq Voice platform.
#
# Mounted read-only at /etc/nats/nats.conf by both compose files; the `nats` service runs
# `-c /etc/nats/nats.conf`. A config file and a command line are NOT merged by nats-server, so the
# `-js --store_dir /data` flags this service used to carry had to move into the `jetstream` block
# below rather than sit alongside the file.
#
# WHY THIS FILE EXISTS
# --------------------
# Without it the broker accepts every anonymous connection on 4222. That is not a theoretical
# exposure on this platform: `rpc.sip.v1.credential` is a request/reply subject that hands out SIP
# password derivations to apps/sipd, the CDR and call-event streams carry every tenant's call
# metadata, and the `routing-cache` KV bucket is the dial plan. Anything that could reach the port
# could read all of it and publish forged events onto it, across every tenant at once.
#
# CREDENTIALS COME FROM THE ENVIRONMENT
# ------------------------------------
# `$NATS_USER` and friends are resolved by nats-server: a `$NAME` reference that is not defined in
# this file is looked up in the process environment. Compose passes them through from `.env`, so no
# password is ever written here or in compose.yaml.
#
# An UNRESOLVED reference is a hard startup error ("variable reference for 'NATS_USER' can not be
# resolved"), not a silent fallback — a stack brought up without these variables fails to start the
# broker instead of quietly starting an open one. That now covers TEN names rather than four: the
# four per-service credentials below are as required as the shared one.
#
# TLS
# ---
# There is deliberately no `tls` block HERE. Transport security is an OVERLAY: `config/nats-tls.conf`
# includes this file and adds the block, and `compose.tls.yaml` points the container at it and mounts
# the certificates. See the header of `config/nats-tls.conf` for why the split is that way round.

# The client port. `expose`d on the compose network; published to the host by compose.dev.yaml only.
port: 4222

# JetStream. Load-bearing rather than an optimisation: without it the engine cannot apply its
# stream/KV definitions at boot, the `channels` and `routing-cache` buckets do not exist, and every
# `cdr.leg.write` is refused.
jetstream {
  store_dir: "/data"
}

# TWO ACCOUNTS, because they are two different jobs.
#
# An account is a subject-space boundary: accounts cannot see each other's subjects, and JetStream
# assets belong to exactly one of them. Defining any account also REMOVES the implicit `$G` global
# account that unauthenticated clients would otherwise land in, which is what turns an anonymous
# connect into an "Authorization Violation" rather than a working session.
#
#   OPTIMIQ  every platform service — apps/api, apps/engine, apps/mediad, apps/sipd and the
#            operational scripts. ONE account, because they share a subject space by design: the
#            engine consumes what the API publishes, the CDR writer consumes what the engine
#            publishes, and JetStream assets belong to exactly one account so splitting the
#            services across accounts would mean the streams could only exist in one of them.
#
#   $SYS     the server's own account: `$SYS.>` monitoring, `nats server report`, account and
#            JetStream introspection. Kept apart from OPTIMIQ so an operator credential is not the
#            same secret every service container holds, and so a leaked service password cannot
#            read server internals. `$SYS` is nats-server's default system-account name, so naming
#            the account is all it takes — no `system_account` directive.
#
# FIVE USERS IN ONE ACCOUNT
# -------------------------
# One account, but no longer one identity. Each service authenticates as itself and carries a
# permission set built from what that service's code actually publishes and subscribes to. The
# permissions are ALLOW-LISTS: anything not named is refused, so a subject added to a service
# without being added here fails loudly at that service rather than quietly succeeding everywhere.
#
# What this buys, concretely:
#
#   * apps/mediad cannot read `rpc.sip.v1.credential`. A compromised media plane — the process with
#     the widest network exposure on the platform, since it terminates RTP from the internet —
#     cannot ask the control plane for a tenant's SIP password derivations.
#   * apps/sipd cannot write a CDR leg or a call event. The SIP edge is a producer of registration
#     facts and a READ-ONLY consumer of two things — the `presence` bucket and the MWI count events
#     — so it can light a lamp but cannot forge a billing record, a call event, or a device state.
#   * Neither Go service can read the other's KV bucket, or the dial plan.
#   * apps/engine cannot write `routing-cache`, `did-index` or `queue-membership` — the three
#     buckets the CONTROL plane owns. It reads and watches them; a bug in the call path cannot
#     rewrite a tenant's routing.
#   * apps/api cannot write `channels`, `park-claims` or `conference-claims` — the three buckets
#     the CALL path owns.
#
# WHY api AND engine GET `$JS.API.>` AND THE GO SERVICES DO NOT
# -------------------------------------------------------------
# JetStream is not a subject family, it is an RPC surface reached over `$JS.API.>` request subjects
# with replies on `_INBOX.>`. Denying it does not degrade JetStream, it breaks it — usually as a
# timeout rather than as an authorization error, because the client is waiting for a reply the
# server refused to let it publish for.
#
# The precise subjects depend on asset names AND, for consumers, on the consumer name and the
# filter subject, which appear as further tokens:
#
#   $JS.API.STREAM.CREATE.<stream>
#   $JS.API.CONSUMER.CREATE.<stream>.<consumer>.<filter subject, dots and all>
#   $JS.API.DIRECT.GET.<stream>.<subject>
#
# For apps/api and apps/engine that surface is genuinely large and genuinely moving: between them
# they create eight streams and ten KV buckets, run four named durable consumers
# (`cdr-leg-writer`, `cdr-recording-writer`, `pbx-emergency-notifier`, `pbx-voicemail-writer`) and
# open ANONYMOUS ordered consumers for every KV `watch()` and `keys()` — whose names are generated
# per call and whose filter subjects become subject tokens. An allow-list enumerating those would
# be exact today and wrong the first time somebody renames a consumer or adds a `watch`, and the
# failure would be a call path that stops delivering rather than a config error. So the two
# TypeScript services get the JetStream API PREFIX for this account and the tightening stops there,
# deliberately and on the record. They still cannot reach another account's assets: `$JS.API.>` is
# account-scoped, so it is the JetStream surface of OPTIMIQ and nothing else.
#
# apps/mediad and apps/sipd are the opposite case and are scoped precisely, because their JetStream
# use is small, fixed and unlikely to grow: one KV bucket for mediad and two for sipd (one written,
# one read), no streams created, no durable consumers. Their entries below are the exact list, and if
# one of them ever grows a consumer it will fail at boot with an authorization error naming the
# subject — which is the right way to find out.
#
# `_INBOX.>` IS GRANTED TO EVERY USER, BOTH WAYS
# ----------------------------------------------
# Request-reply needs it on both sides and it cannot be narrowed usefully: a requester subscribes to
# the inbox IT generated (`_INBOX.<nuid>.<nuid>`, chosen by the client at connect time), and a
# responder must PUBLISH to an inbox somebody else generated. Every JetStream API call and every
# acked publish is also a request-reply. So `_INBOX.>` appears on both lists for all five users, and
# the isolation comes from the business subjects instead.
accounts {
  OPTIMIQ: {
    jetstream: enabled
    users: [
      # ---------------------------------------------------------------------------------------
      # dev / admin — the shared identity, and the ONLY one with no permission block.
      #
      # It is what the root `.env` still sets as NATS_USER/NATS_PASS, what the `nats` CLI connects
      # with, what every `pnpm verify:*` harness in apps/api/scripts uses, and what a deployment
      # that has not yet split its credentials falls back to (see
      # `packages/config/src/nats-credentials.ts`). The verify scripts publish and subscribe across
      # the whole taxonomy on purpose — they stand in for whichever service they are exercising —
      # so scoping this user would mean maintaining a sixth permission set that is the union of the
      # other four.
      #
      # It is an OPERATOR credential. Nothing in compose passes it to a service container any more.
      { user: $NATS_USER, password: $NATS_PASS }

      # ---------------------------------------------------------------------------------------
      # apps/api — the control plane.
      #
      # Publishes three event families, answers three RPCs, owns four KV buckets and reads two
      # more, and runs the four durable CDR/PBX consumers.
      {
        user: $NATS_API_USER
        password: $NATS_API_PASS
        permissions: {
          publish: {
            allow: [
              # Events it emits. `agent.state` on the `_all` queue scope, `mwi.updated` per
              # mailbox, and the device-provisioning trail.
              "queue.evt.v1.>"
              "voicemail.evt.v1.>"
              "provision.evt.v1.*"
              # The KV buckets the CONTROL plane owns and writes.
              "$KV.routing-cache.>"
              "$KV.did-index.>"
              "$KV.queue-membership.>"
              "$KV.agent-state.>"
              # Click-to-call: the control plane asking the engine to place a call. The ONLY subject
              # apps/api publishes onto the engine's own RPC surface. Publish and not subscribe —
              # the reply comes back on `_INBOX.>`, which is already granted below.
              "rpc.engine.v1.originate"
              # JetStream: stream and bucket creation, durable consumer creation, message acks.
              # See the note above on why this is the prefix and not an enumeration.
              "$JS.API.>"
              "$JS.ACK.>"
              # RPC replies, and the reply side of every JetStream request.
              "_INBOX.>"
            ]
          }
          subscribe: {
            allow: [
              # The live WebSocket fan-out's three core subscriptions (`live-hub.service.ts`).
              "calls.evt.v1.>"
              "queue.evt.v1.>"
              "voicemail.evt.v1.>"
              # The three subjects it RESPONDS on. `rpc.sip.v1.credential` is the raw-wire one
              # behind the `optimiq-api-sip-credentials` queue group; the other two are the Nest
              # microservice's `@MessagePattern`s.
              "rpc.routing.v1.resolve"
              "rpc.voicemail.v1.list"
              "rpc.sip.v1.credential"
              # NOTHING is added here for the webhook dispatcher, and that is worth stating rather
              # than leaving to be rediscovered: its four durable consumers read the CALLS, QUEUES,
              # VOICEMAIL and CDR streams, but a JetStream consumer does not SUBSCRIBE to the
              # stream's subjects — the server delivers to an inbox and the pulls are `$JS.API.>`
              # requests. Both are already granted. A subject list here would look like the
              # permission and would in fact be dead configuration.
              # The two buckets it READS and watches but never writes — sipd owns `registrations`,
              # the engine owns `channels`.
              "$KV.registrations.>"
              "$KV.channels.>"
              "$KV.agent-state.>"
              # Durable consumer deliveries, KV watch deliveries, every JetStream API reply.
              "_INBOX.>"
            ]
          }
        }
      }

      # ---------------------------------------------------------------------------------------
      # apps/engine — the call path.
      #
      # The busiest identity: it emits the whole call and queue vocabulary, writes CDR legs and
      # voicemail deposits into JetStream, calls six RPCs — one of which it also ANSWERS, to hand a
      # parked call to another engine instance — and applies the stream/KV definitions at boot
      # (`ENGINE_ENSURE_STREAMS`, default on).
      {
        user: $NATS_ENGINE_USER
        password: $NATS_ENGINE_PASS
        permissions: {
          publish: {
            allow: [
              # The call vocabulary — channel lifecycle, conference, park, transfer, pickup and
              # the Kari's Law `call.emergency.dialed` seam.
              "calls.evt.v1.>"
              # Queue caller/agent facts.
              "queue.evt.v1.>"
              # `message.left` only, but the subject shape is per-mailbox so the filter is the
              # family. `mwi.updated` on the same family belongs to apps/api; the split is by
              # event name inside a shared family and NATS permissions cannot express that
              # without enumerating orgs, so the family is granted and the contract holds it.
              "voicemail.evt.v1.>"
              # The billing ledger. Acked JetStream publish with a `Nats-Msg-Id`.
              "cdr.leg.v1.*"
              # The RPCs it calls.
              "rpc.routing.v1.resolve"
              "rpc.voicemail.v1.list"
              "rpc.media.v1.allocate-session"
              "rpc.media.v1.bridge-sessions"
              "rpc.media.v1.unbridge-sessions"
              "rpc.media.v1.release-session"
              # Rung 1's playback pair. Enumerated rather than granted as `rpc.media.v1.*`, for the
              # same reason the four above it are: this list is the record of what the engine
              # actually calls, so a subject added to the code without being added here fails at
              # that service with the subject named instead of quietly succeeding everywhere.
              "rpc.media.v1.start-playback"
              "rpc.media.v1.stop-playback"
              # Rung 3's digit generator and rung 4's recording pair. Same enumeration, same reason.
              "rpc.media.v1.send-dtmf"
              "rpc.media.v1.start-recording"
              "rpc.media.v1.stop-recording"
              # The one RPC it both CALLS and ANSWERS: engine to engine, to collect a call parked
              # on another instance. The trailing token is the OWNING instance's id, so this
              # wildcard is one token wide and covers every replica — an enumeration would need a
              # broker restart every time a pod is rescheduled. Publish and subscribe are both
              # granted because every instance is a requester and a responder at once, and which
              # one it is on a given call depends on where the phone that dialled the orbit landed.
              "rpc.engine.v1.park-handoff.*"
              # The KV buckets the CALL path owns. `routing-cache`, `did-index` and
              # `queue-membership` are deliberately absent: the engine reads and watches those,
              # apps/api writes them.
              "$KV.channels.>"
              "$KV.agent-state.>"
              "$KV.park-claims.>"
              "$KV.conference-claims.>"
              # `presence` — per-extension device state, the value a BLF key renders. The engine is
              # its ONLY writer, because it is the only process that sees a channel change call
              # state. It appears on the subscribe list too: the value is a MERGE POINT across engine
              # instances (see extensionPresenceSchema), so a write is a compare-and-swap that has to
              # read the current revision first.
              "$KV.presence.>"
              "$JS.API.>"
              "$JS.ACK.>"
              "_INBOX.>"
            ]
          }
          subscribe: {
            allow: [
              # The media plane's session lifecycle, taken as a core subscription rather than a
              # durable consumer on purpose.
              "media.evt.v1.>"
              # The park handoffs it answers for the calls it holds. See the publish side above.
              "rpc.engine.v1.park-handoff.*"
              # Click-to-call, from apps/api. SUBSCRIBE only, on the same asymmetry as the REFER
              # below: the reply goes to the requester's `_INBOX.>`. Served on the queue group
              # `optimiq-engine-originate`, and the subject is FLAT rather than instance-addressed
              # like `park-handoff` above — an originate CREATES the call, so any instance may
              # answer and exactly one must, which is what a queue group produces.
              "rpc.engine.v1.originate"
              # A desk phone's REFER, relayed by apps/sipd. SUBSCRIBE only, and that asymmetry is
              # the shape of every responder here: the reply goes to the requester's `_INBOX.>`,
              # which the publish list already grants, so this subject never appears there. Served
              # on the queue group `optimiq-engine-sip-transfer`; a queue group needs no permission
              # of its own, the subject is the permission.
              "rpc.sip.v1.transfer"
              # The buckets it reads and watches.
              "$KV.routing-cache.>"
              "$KV.did-index.>"
              "$KV.queue-membership.>"
              "$KV.channels.>"
              "$KV.agent-state.>"
              "$KV.park-claims.>"
              "$KV.conference-claims.>"
              # Read as well as written — see the publish side.
              "$KV.presence.>"
              # RPC replies, JetStream replies, KV watch deliveries.
              "_INBOX.>"
            ]
          }
        }
      }

      # ---------------------------------------------------------------------------------------
      # apps/mediad — the media plane. The narrowest identity on the broker, and the one that
      # matters most: this is the process with RTP sockets open to the internet.
      #
      # It answers nine commands, emits four session-lifecycle events and owns one KV bucket. It
      # makes no requests at all, so it needs no publish grant on any `rpc.` subject.
      {
        user: $NATS_MEDIAD_USER
        password: $NATS_MEDIAD_PASS
        permissions: {
          publish: {
            allow: [
              # `session.ended`, `session.rtp-timeout`, `playback.finished` and
              # `recording.finished`. The event token is DOTTED, so the subject has six tokens and
              # `media.evt.v1.*.*.*` would match none of them — which is also why rung 1's third
              # event and rung 4's fourth needed no change here.
              "media.evt.v1.>"
              # Its bucket, and only its bucket.
              "$KV.media-sessions.>"
              # The exact JetStream surface, enumerated because it is small and static: bucket
              # open (INFO then CREATE-or-UPDATE), and the two read paths a KV `Get` may take.
              "$JS.API.INFO"
              "$JS.API.STREAM.INFO.KV_media-sessions"
              "$JS.API.STREAM.CREATE.KV_media-sessions"
              "$JS.API.STREAM.UPDATE.KV_media-sessions"
              "$JS.API.STREAM.MSG.GET.KV_media-sessions"
              "$JS.API.DIRECT.GET.KV_media-sessions.>"
              # `msg.Respond` publishes to the ENGINE's inbox, and JetStream publish acks come
              # back on this one.
              "_INBOX.>"
            ]
          }
          subscribe: {
            allow: [
              # The command surface, on queue group `mediad`. A queue group needs no permission
              # of its own — the subject is the permission.
              "rpc.media.v1.allocate-session"
              "rpc.media.v1.bridge-sessions"
              "rpc.media.v1.unbridge-sessions"
              "rpc.media.v1.release-session"
              "rpc.media.v1.start-playback"
              "rpc.media.v1.stop-playback"
              "rpc.media.v1.send-dtmf"
              "rpc.media.v1.start-recording"
              "rpc.media.v1.stop-recording"
              "_INBOX.>"
            ]
          }
        }
      }

      # ---------------------------------------------------------------------------------------
      # apps/sipd — the SIP edge. A producer, two requesters, and — since the presence spine — two
      # READ-ONLY consumers: the `presence` bucket a BLF key renders, and the MWI count events that
      # light a voicemail lamp. It still writes nothing outside its own bucket.
      {
        user: $NATS_SIPD_USER
        password: $NATS_SIPD_PASS
        permissions: {
          publish: {
            allow: [
              # `registered` / `unregistered` / `expired`, acked into the REGISTRATIONS stream.
              "sip.reg.v1.>"
              # The two requests it makes. SIP password derivations from apps/api, active only when
              # SIPD_CREDENTIAL_SOURCE=nats; and a desk phone's REFER handed to apps/engine, which
              # is the edge's ONLY publish onto a subject the call path serves. Both are core
              # request-reply, so the reply arrives on `_INBOX.>` below and neither needs a
              # subscribe grant here.
              "rpc.sip.v1.credential"
              "rpc.sip.v1.transfer"
              # Its bucket, and only its bucket. Note what is NOT here: `$KV.presence.>`. A KV write
              # is a publish onto that subject, so leaving it off is what makes sipd's access to the
              # presence bucket read-only — the SIP edge renders device state, it never asserts any.
              "$KV.registrations.>"
              "$JS.API.INFO"
              "$JS.API.STREAM.INFO.KV_registrations"
              "$JS.API.STREAM.CREATE.KV_registrations"
              "$JS.API.STREAM.UPDATE.KV_registrations"
              "$JS.API.STREAM.MSG.GET.KV_registrations"
              "$JS.API.DIRECT.GET.KV_registrations.>"
              # `bucket.Keys()` at boot (registration rehydration) opens an ANONYMOUS ordered
              # consumer. BOTH forms are needed and neither covers the other: a client that names
              # the consumer and its filter puts them after the stream as further tokens
              # (`…CREATE.KV_registrations.<name>.$KV.registrations.>`), while a client asking the
              # server to generate the name sends the BARE `…CREATE.KV_registrations` — and `>`
              # matches one-or-more tokens, never zero. Leaving the bare form out is a permissions
              # violation on the first rehydration, which is what the verification caught.
              "$JS.API.CONSUMER.CREATE.KV_registrations"
              "$JS.API.CONSUMER.CREATE.KV_registrations.>"
              "$JS.API.CONSUMER.DELETE.KV_registrations.>"
              "$JS.API.CONSUMER.INFO.KV_registrations.>"
              # The `presence` bucket, READ side only. Bucket open (INFO then CREATE-or-UPDATE) and
              # the two read paths a KV `Get` may take — the same five subjects as the registrations
              # bucket above, minus the `$KV.presence.>` write.
              #
              # CREATE/UPDATE are here and are not a write grant: they provision the BUCKET, not a
              # value in it. sipd opens it with CreateOrUpdateKeyValue for the reason kv.Open does —
              # an edge that refused to start because apps/engine had not booted yet would turn a
              # deploy ordering detail into a SIP outage — and the definition it applies comes from
              # packages/events-go, so it cannot create one the engine disagrees with.
              "$JS.API.STREAM.INFO.KV_presence"
              "$JS.API.STREAM.CREATE.KV_presence"
              "$JS.API.STREAM.UPDATE.KV_presence"
              "$JS.API.STREAM.MSG.GET.KV_presence"
              "$JS.API.DIRECT.GET.KV_presence.>"
              # `bucket.WatchAll()` — one watch per instance, feeding every BLF subscription — opens
              # an ANONYMOUS ordered consumer. BOTH forms are needed and neither covers the other:
              # a client that names the consumer and its filter puts them after the stream as further
              # tokens (`…CREATE.KV_presence.<name>.$KV.presence.>`), while a client asking the
              # server to generate the name sends the BARE `…CREATE.KV_presence` — and `>` matches
              # one-or-more tokens, never zero. This is the same trap the registrations rehydration
              # fell into; the shape is copied deliberately.
              "$JS.API.CONSUMER.CREATE.KV_presence"
              "$JS.API.CONSUMER.CREATE.KV_presence.>"
              "$JS.API.CONSUMER.DELETE.KV_presence.>"
              "$JS.API.CONSUMER.INFO.KV_presence.>"
              "_INBOX.>"
            ]
          }
          subscribe: {
            allow: [
              # ONE business subject, added with the presence spine: the mailbox counts that light a
              # voicemail lamp, taken as a CORE subscription rather than a durable consumer so a
              # restart does not replay a backlog of stale counts at every phone at once. `apps/api`
              # publishes it; sipd turns it into an RFC 3842 NOTIFY.
              #
              # `mwi.updated` is a DOTTED event name, so the subject has six tokens. The mailbox
              # wildcard cannot be a `>`: `voicemail.evt.v1.*.>` would also match `message.left`,
              # which is the engine's event about a recording and carries no counts at all.
              "voicemail.evt.v1.*.*.mwi.updated"
              # Replies: the credential RPC's answer, the JetStream publish acks, the rehydration
              # consumer's deliveries and the presence watch's.
              "_INBOX.>"
            ]
          }
        }
      }
    ]
  }

  $SYS: {
    users: [
      { user: $NATS_SYS_USER, password: $NATS_SYS_PASS }
    ]
  }
}

# There is deliberately NO `no_auth_user`. That directive maps anonymous connections onto a named
# user and would reinstate exactly the exposure this file exists to close.
