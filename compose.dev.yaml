services:
  # `dashboard` is deliberately absent: the legacy React Router app is no longer part of the stack.
  # Its source and Dockerfile are untouched, so `docker build -f apps/dashboard/Dockerfile .` still
  # works for anyone who needs it — it just is not wired up any more.
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        # Both are compiled into the image rather than read at boot. Rebuild to change either.
        - API_PROXY_ORIGIN=${API_PROXY_ORIGIN:-http://api:9876}
        - NEXT_PUBLIC_AUTH_BASE_URL=${NEXT_PUBLIC_AUTH_BASE_URL:-}
    ports:
      - 3100:3100

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    volumes:
      - ./.keys:/opt/optimiq-voice/keys
    # The legacy gRPC listener (:50051) is NOT published to the host, and must not be.
    #
    # It is the identity-era surface: it terminates plaintext h2c (`getServerCredentials` returns
    # insecure credentials unless a certificate is mounted), it fronts the legacy identity handlers,
    # and its `createAuthInterceptor` verifies a token the same process signs. Publishing it put a
    # credential oracle on 0.0.0.0:50051 of every developer machine and of anything that ran this
    # file — reachable from the LAN, from a container on a shared bridge, and from any process on
    # the box, with no TLS to make interception visible.
    #
    # The port stays open INSIDE the compose network (`expose: 50051` in compose.yaml), because two
    # services still dial it there: `envoy`'s `api-cluster` and `autopilot`'s
    # `AUTOPILOT_API_ENDPOINT` (default `api:50051`). Both are compose-internal, so removing the
    # publication costs nothing they need. Reaching it from the host is `docker compose exec` or a
    # deliberate `docker compose run --publish`, which is the point: it becomes a decision.
    #
    # The whole listener dies with the legacy identity service in a later phase; until then this is
    # the boundary.
    environment:
      - API_ROUTR_API_ENDPOINT
      - API_SMTP_PORT
      - API_SMTP_SECURE

  autopilot:
    build:
      context: .
      dockerfile: ./apps/autopilot/Dockerfile

  routr:
    ports:
      - 51907:51907
      - 51908:51908
      - 5060:5060/udp
      - 5060-5063:5060-5063
    environment:
      # In development this environment variable points to an
      # address not accessible from the container. Therefore, we
      # need to manually point to the NAT's container address here.
      #
      # The credentials are IN THE URL, unlike every first-party service, because `routr` is a
      # third-party image whose only NATS configuration is this one variable. It does not log the
      # URL, which is what makes that acceptable here and not elsewhere.
      NATS_PUBLISHER_URL: nats://${NATS_USER}:${NATS_PASS}@nats:4222
      CONSOLE_PUBLISHER_ENABLED: "true"
    volumes:
      - ./etc/log4j2.yaml:/etc/routr/log4j2.yaml
      - ./.keys/public.pem:/etc/routr/keys/public.pem

  asterisk:
    build:
      context: apps/asterisk
      dockerfile: ./Dockerfile
    ports:
      - 6060:6060
      - 8088:8088
    environment:
      # Two registrable extensions (1001 / 1002) with static credentials, so the
      # routing slice can be driven from a softphone without a provisioning
      # layer. Development compose only — see pjsip_dev_endpoints.conf.
      OPTIMIQ_DEV_ENDPOINTS: ${OPTIMIQ_DEV_ENDPOINTS:-true}
      # Where run.sh looks for the generated musiconhold.conf and where the
      # engine's `object://` media resolves. Must equal the container side of
      # the mount below and apps/engine's ENGINE_MEDIA_OBJECT_ROOT.
      OPTIMIQ_MEDIA_OBJECT_ROOT: /var/lib/optimiq/objects
    volumes:
      # The object store, read-only.
      #
      # In development apps/api runs on the HOST (see `start:services`, which
      # brings up the infrastructure and not the app), so the uploads it writes
      # under PBX_MEDIA_OBJECT_ROOT are on the host filesystem — bind-mounting
      # that directory is what lets the media server open the audio at all.
      #
      # Two things need it, and both are silent failures without it: prompts and
      # voicemail greetings, which the compiler emits as `object://<key>` and the
      # engine renders as a `sound:` path; and tenant hold music, whose generated
      # `moh/musiconhold.conf` run.sh copies into /etc/asterisk at start.
      #
      # `compose.yaml` deliberately does NOT do this: there is no object-store
      # service in the shipped stack to mount, so the mount would name a path
      # that does not exist. See apps/asterisk/README.md.
      - ${PBX_MEDIA_OBJECT_ROOT:-${CDR_RECORDING_ROOT:-./.media}}:/var/lib/optimiq/objects:ro
    extra_hosts:
      api: ${DOCKER_HOST_ADDRESS}

  engine:
    build:
      context: .
      dockerfile: ./apps/engine/Dockerfile
    ports:
      - 4010:4010
    environment:
      NODE_ENV: development
      LOGS_LEVEL: ${ENGINE_LOGS_LEVEL:-debug}
      # The container-side path of the asterisk service's object-store mount
      # above. The engine never opens these files — it hands Asterisk a
      # `sound:<root>/<key>` — so this must be ASTERISK's path, not the engine's,
      # and the two containers agreeing is the whole point of pinning it here.
      # Unset, greetings and prompts fall back to the built-in announcements.
      ENGINE_MEDIA_OBJECT_ROOT: /var/lib/optimiq/objects

  postgres:
    ports:
      - 5432:5432

  influxdb:
    ports:
      - 8086:8086

  envoy:
    extra_hosts:
      api: ${DOCKER_HOST_ADDRESS}
    environment:
      - loglevel=debug

  nats:
    ports:
      - 4222:4222

  adminer:
    image: adminer:standalone
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - 8282:8080

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - 8025:8025
      - 1025:1025
