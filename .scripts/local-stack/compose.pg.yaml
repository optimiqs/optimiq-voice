name: voice-e2e

services:
  postgres:
    image: postgres:16.10-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD}
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:${PG_PORT:-5533}:5432"
    volumes:
      - voice-e2e-pgdata:/var/lib/postgresql/data
      - ../../config/postgres/init-voice.sql:/docker-entrypoint-initdb.d/10-voice.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  voice-e2e-pgdata:
