context: |
  # Project: Optimiq Voice

  Optimiq Voice is a complete business calling system for phone numbers, inbound and outbound
  calls, AI receptionists, SIP connectivity, and custom call flows. It is a TypeScript monorepo
  (`apps/*` and `packages/*`) whose services are composed into a single gRPC `api` alongside
  voice/telephony infrastructure (Asterisk/ARI, NATS, InfluxDB).

  ## Relevant modules

  - `packages/identity` — `@optimiq-voice/identity`: a **library** exporting `buildIdentityService(config)`
    (gRPC service definition + handlers), the canonical Drizzle schema, and helpers
    (`upsertDefaultUser`). Entities: User, Workspace, WorkspaceMember, ApiKey, VerificationCode.
    RS256 JWTs (id/access/refresh) with a single issuer/audience per instance.
  - `apps/api` — composes identity + voice services into one gRPC server with an auth
    interceptor, a public-method allow-list, an accept-invite HTTP bridge, and default seeding.
    Coupled to telephony infra (NATS/InfluxDB/Asterisk).
  - `packages/sdk` — `@optimiq-voice/sdk`: client SDK with `Users`/`Workspaces`/`ApiKeys` wrappers over
    generated gRPC stubs, targeting a single Optimiq Voice `api` endpoint; stateful single-principal
    (accessKeyId + token refresher).
  - `packages/common` — `createServiceDefinition`, auth interceptor, proto loading.

  ## Context for changes

  External products (e.g. QCobro, an AI-voice collections app) want to **reuse Optimiq Voice
  Identity** without running the telephony monolith. Today they must hand-wire their own
  gRPC server around `buildIdentityService`, vendor the proto + generate a client, and vendor
   the database schema. These OpenSpec changes aim to make Identity consumable as (a) a standalone
  service, (b) a client package, and (c) a multi-product identity store.

  ## Conventions

  - TypeScript, ESM, gRPC (`@grpc/grpc-js`), and Drizzle ORM (PostgreSQL).
  - Spec deltas follow OpenSpec format: `## ADDED/MODIFIED Requirements`, `### Requirement: …`,
    `#### Scenario: …` with WHEN/THEN/AND.
