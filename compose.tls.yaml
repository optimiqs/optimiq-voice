# The TLS overlay for the broker. OPT-IN, and it is the last file on the command line:
#
#   ./config/certs/generate-dev-certs.sh
#   docker compose -f compose.yaml -f compose.dev.yaml -f compose.tls.yaml up nats -d
#
# then point clients at it:
#
#   NATS_URL=tls://localhost:4222
#   NATS_TLS_CA=./config/certs/ca.pem
#
# WHY THIS IS A THIRD FILE
# ------------------------
# Because the alternative is a broker that will not start on a fresh clone. nats-server has no
# conditional in its config language: a `tls` block is either present, in which case the
# certificate files must exist, or absent. Making the block conditional therefore means making the
# CONFIG FILE conditional, and selecting the config file is what `-c` does — so the choice moves
# up one level, to which compose files are on the command line. See `config/nats-tls.conf` for the
# two mechanisms that were rejected.
#
# Nothing else in the stack changes. The port is the same, the credentials are the same, the
# permission sets are the same — `nats-tls.conf` `include`s `nats.conf` and adds nothing but the
# `tls` block. Clients that have not been given `NATS_TLS_CA` will fail to connect, which is the
# correct and visible outcome of turning transport security on halfway.

services:
  nats:
    command: ["-c", "/etc/nats/nats-tls.conf"]
    volumes:
      # The overlay config, alongside the base one compose.yaml already mounts. `include` resolves
      # relative to the including file, so both must land in the same directory.
      - ./config/nats-tls.conf:/etc/nats/nats-tls.conf:ro
      # The certificate material, generated by ./config/certs/generate-dev-certs.sh and gitignored.
      # Read-only: the broker only ever opens these.
      - ./config/certs:/etc/nats/certs:ro
