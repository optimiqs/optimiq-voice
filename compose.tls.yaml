# The TLS overlay. OPT-IN, and it is the last file on the command line:
#
#   ./config/certs/generate-dev-certs.sh
#   docker compose -f compose.yaml -f compose.dev.yaml -f compose.tls.yaml up nats -d
#
# then point clients at it:
#
#   NATS_URL=tls://localhost:4222
#   NATS_TLS_CA=./config/certs/ca.pem
#
# WHY THIS IS A THIRD FILE
# ------------------------
# Because the alternative is a broker that will not start on a fresh clone. nats-server has no
# conditional in its config language: a `tls` block is either present, in which case the
# certificate files must exist, or absent. Making the block conditional therefore means making the
# CONFIG FILE conditional, and selecting the config file is what `-c` does — so the choice moves
# up one level, to which compose files are on the command line. See `config/nats-tls.conf` for the
# two mechanisms that were rejected.
#
# Nothing else in the stack changes. The port is the same, the credentials are the same, the
# permission sets are the same — `nats-tls.conf` `include`s `nats.conf` and adds nothing but the
# `tls` block. Clients that have not been given `NATS_TLS_CA` will fail to connect, which is the
# correct and visible outcome of turning transport security on halfway.

services:
  nats:
    command: ["-c", "/etc/nats/nats-tls.conf"]
    volumes:
      # The overlay config, alongside the base one compose.yaml already mounts. `include` resolves
      # relative to the including file, so both must land in the same directory.
      - ./config/nats-tls.conf:/etc/nats/nats-tls.conf:ro
      # The certificate material, generated by ./config/certs/generate-dev-certs.sh and gitignored.
      # Read-only: the broker only ever opens these.
      - ./config/certs:/etc/nats/certs:ro

  # SIP-TLS and SDES-SRTP on the media server.
  #
  # In the same overlay as the broker's TLS because they are the same operator decision made once —
  # "this stack runs encrypted" — and because they share one generated CA. Splitting them would
  # produce a fourth compose file whose only content is a second copy of this mount.
  #
  # The gate is SIP_TLS_ENABLED, not the presence of the mount: `run.sh` deletes `pjsip_tls.conf`
  # unless it is `true`, and REFUSES TO START if it is true and the certificate is unreadable. See
  # apps/asterisk/config/pjsip_tls.conf for why the TLS block is a separate file at all.
  #
  # The plaintext transport is untouched. 6060 still answers TCP, every already-provisioned phone
  # keeps working, and 5061 is added beside it — turning transport security on must never be the
  # same act as moving a listener.
  asterisk:
    environment:
      SIP_TLS_ENABLED: ${SIP_TLS_ENABLED:-true}
      SIP_TLS_BINDADDR: ${SIP_TLS_BINDADDR:-0.0.0.0:5061}
      SIP_TLS_CERT_FILE: ${SIP_TLS_CERT_FILE:-/etc/asterisk/certs/asterisk.pem}
      SIP_TLS_PRIV_KEY_FILE: ${SIP_TLS_PRIV_KEY_FILE:-/etc/asterisk/certs/asterisk-key.pem}
      # Empty by default. Only the leg where Asterisk is the TLS client — an outbound trunk with
      # SIP_TLS_VERIFY_SERVER=yes — needs a CA list; a registering phone is authenticated by SIP
      # digest over the encrypted channel, not by a client certificate this platform cannot issue.
      SIP_TLS_CA_FILE: ${SIP_TLS_CA_FILE:-}
      SIP_TLS_METHOD: ${SIP_TLS_METHOD:-tlsv1_2}
      SIP_TLS_VERIFY_SERVER: ${SIP_TLS_VERIFY_SERVER:-no}
      # The static dev extensions stay on TCP unless asked otherwise, so bringing this overlay up
      # adds a listener and changes nothing that already works. Set to `transport-tls` to move
      # them and exercise the encrypted path end to end.
      SIP_ENDPOINT_TRANSPORT: ${SIP_ENDPOINT_TRANSPORT:-transport-tcp}
      SIP_MEDIA_ENCRYPTION_OPTIMISTIC: ${SIP_MEDIA_ENCRYPTION_OPTIMISTIC:-yes}
    expose:
      - 5061
    ports:
      # Published so a softphone on the developer's machine and an `openssl s_client` handshake
      # check can both reach it. `compose.yaml` only `expose`s the plaintext port; this is the
      # development affordance, mirroring compose.dev.yaml's 6060/8088.
      - 5061:5061
    volumes:
      - ./config/certs:/etc/asterisk/certs:ro
