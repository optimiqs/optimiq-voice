; ==============================================================================
; TELNYX CREDENTIAL TRUNK — EXAMPLE / DEVELOPMENT TEMPLATE
; ==============================================================================
;
; The pjsip shape a trunk provisioned by `POST /api/v1/trunks/:id/provision-telnyx`
; needs. It is an EXAMPLE, not a live configuration: this file is not
; `#include`d by `pjsip.conf`, so nothing here takes effect unless somebody
; copies it deliberately.
;
; That is on purpose. Static SIP credentials in version control are exactly the
; problem `pjsip_dev_endpoints.conf` exists to contain, and a trunk template
; that auto-loaded would be a template someone eventually filled in and
; committed. The values below are placeholders and are not credentials.
;
; ------------------------------------------------------------------------------
; WHERE THE VALUES COME FROM
; ------------------------------------------------------------------------------
;
; Provisioning returns them once, and the trunk row keeps everything except the
; password:
;
;   trunk.sip_domain              -> sip.telnyx.com        (the registrar)
;   trunk.sip_proxy               -> sip:sip.telnyx.com:5060
;   trunk.auth_user               -> the generated SIP username
;   trunk.register_expires_seconds-> 180
;   trunk.carrier_ref             -> the Telnyx credential_connection id
;
; The password is NOT in the database. It is in the provisioning response, and
; it stays re-derivable from Telnyx via `carrier_ref`
; (`GET /v2/credential_connections/{id}` echoes it). See
; `apps/api/src/pbx/carrier/carrier.service.ts`.
;
; ------------------------------------------------------------------------------
; WHY REGISTRATION, AND WHAT IT IS AND IS NOT FOR
; ------------------------------------------------------------------------------
;
; Telnyx credential connections are the right shape for this platform because
; they are the only connection type that needs NOTHING from the customer's
; network — no static public IP, no DNS record, no firewall rule accepting
; unsolicited INVITEs. A tenant's Asterisk can sit behind NAT on a laptop and
; still receive calls.
;
; The REGISTER is what makes that true, and it is required for INBOUND ONLY.
; Outbound placement needs no registration at all: Telnyx answers the INVITE
; with a SIP 407 and the same digest credential satisfies it. So a trunk whose
; registration has lapsed can still place calls while silently receiving none —
; which is precisely why `registration/expiration` is 180 rather than the 3600
; a "it works, leave it" instinct would pick. 180 seconds is the worst-case
; recovery time for inbound after a network blip.
;
; `line = yes` matters more than it looks: it tags inbound requests arriving on
; this registration as belonging to this endpoint, so Telnyx's INVITE is matched
; to the right endpoint and lands in the right context. Without it the INVITE is
; identified by source IP and falls through to whatever the global identifier
; order finds first.
;
; ------------------------------------------------------------------------------
; CONTEXT, AND THE ONE MISTAKE THAT MATTERS
; ------------------------------------------------------------------------------
;
; `context = optimiq-inbound`. Carrier traffic is UNAUTHENTICATED traffic that
; happens to arrive over an authenticated transport, and it must never land in
; `optimiq-internal` — that context is the one registered devices use, and a
; carrier that could reach it could dial internal feature codes and, worse,
; re-enter the outbound routes. That is the classic open-relay: an attacker
; sends a call to one of your DIDs and it comes back out of your trunk as
; billable international minutes.
;
; ------------------------------------------------------------------------------
; NETWORK
; ------------------------------------------------------------------------------
;
; Signalling  : sip.telnyx.com                 5060/UDP, 5060/TCP, 5061/TLS
;               Regional alternatives exist and are region-specific FQDNs, not
;               subdomains: sip.telnyx.eu, sip.telnyx.com.au, sip.telnyx.ca,
;               sip.telnyx.me, sip.telnyx.asia. (Names of the form
;               `sip-eu.telnyx.com` appear in two Telnyx doc pages and do not
;               resolve.) `TELNYX_SIP_REGION` selects which one provisioning
;               writes into the trunk row.
; Media       : Telnyx sources RTP from UDP 16384-32768.
; Webhooks    : delivered from 192.76.120.192/27.
;
; With the default `Latency` anchorsite, Telnyx probes with ICMP to choose a
; media edge — a firewall that drops ICMP will get a worse anchorsite than it
; deserves, or none.
;
; ==============================================================================

[telnyx-reg]
type = registration
transport = transport-tcp
outbound_auth = telnyx-auth
server_uri = sip:sip.telnyx.com
client_uri = sip:TELNYX_SIP_USERNAME@sip.telnyx.com
contact_user = TELNYX_SIP_USERNAME
; Short by design — see the header. This is the inbound recovery time.
expiration = 180
retry_interval = 30
forbidden_retry_interval = 300
max_retries = 10000
; Tags inbound requests on this registration as this endpoint's, so the carrier's
; INVITE is endpoint-matched rather than IP-matched.
line = yes
endpoint = telnyx

[telnyx-auth]
type = auth
auth_type = userpass
username = TELNYX_SIP_USERNAME
password = TELNYX_SIP_PASSWORD

[telnyx-aor]
type = aor
contact = sip:sip.telnyx.com:5060
; OPTIONS every 60s. The engine's trunk status columns are fed from this.
qualify_frequency = 60

[telnyx-identify]
type = identify
endpoint = telnyx
; Belt and braces alongside `line = yes`: if the registration lapses mid-call-setup,
; source-IP identification still routes the INVITE to this endpoint rather than to
; the anonymous fallback.
match = 192.76.120.0/24
match = 64.16.250.0/24

[telnyx]
type = endpoint
transport = transport-tcp
; Carrier traffic is untrusted traffic. NEVER `optimiq-internal` — see the header.
context = optimiq-inbound
aors = telnyx-aor
outbound_auth = telnyx-auth
from_user = TELNYX_SIP_USERNAME
from_domain = sip.telnyx.com
disallow = all
; Telnyx trunks carry PCMU/PCMA/G722; Opus is not offered on trunk connections.
allow = ulaw,alaw,g722
direct_media = no
rtcp_mux = yes
; RFC 2833 matches the connection's `dtmf_type` default. Changing one without the
; other produces a trunk where DTMF silently stops working inside IVRs.
dtmf_mode = rfc2833
rewrite_contact = yes
force_rport = yes
; The carrier decides the caller id on inbound; on outbound the outbound voice
; profile and `trunk.caller_id_number_override` decide it.
trust_id_inbound = no
send_rpid = no
