; ==============================================================================
; DEVELOPMENT ENDPOINTS — STATIC CREDENTIALS, NEVER FOR PRODUCTION
; ==============================================================================
;
; Two registrable extensions so the engine's routing slice can be driven with a
; real softphone (or by the gated integration suite) without a provisioning
; layer. The passwords are in version control and are therefore public.
;
; This file is NOT loaded unless `OPTIMIQ_DEV_ENDPOINTS=true` is set in the
; container's environment: `run.sh` DELETES it otherwise, and `pjsip.conf`
; reaches it with `#tryinclude`, which tolerates the absence. The default is
; therefore "no static credentials on this box", and enabling them is an
; explicit act — the opposite of the arrangement where somebody has to remember
; to remove them before a deploy.
;
; Register with, e.g.:
;   user 1001 / password optimiq-dev-1001 / host <asterisk>:6060 / transport TCP
;
; The transport is `SIP_ENDPOINT_TRANSPORT` (default `transport-tcp`). With `SIP_TLS_ENABLED=true`
; and `SIP_ENDPOINT_TRANSPORT=transport-tls` the same two extensions register over TLS on
; `SIP_TLS_BINDADDR` (default 5061) and negotiate SDES-SRTP, which is how the encrypted path is
; exercised without a provisioning layer.

[1001]
type = aor
max_contacts = 2
remove_existing = yes
qualify_frequency = 30

[1001]
type = auth
auth_type = userpass
username = 1001
password = optimiq-dev-1001

[1001]
type = endpoint
; The context decides which resolver the engine runs for anything this phone
; dials. `optimiq-internal` is the authenticated one; putting a registered
; device into `optimiq-inbound` would let it resolve as carrier traffic.
context = optimiq-internal
transport = SIP_ENDPOINT_TRANSPORT_PLACEHOLDER
; Set to `sdes` by run.sh only when the endpoint transport is TLS; `no` otherwise. An `a=crypto`
; line in an SDP that crossed the network in the clear publishes the media key, so the two settings
; are one decision — see pjsip_tls.conf.
media_encryption = SIP_MEDIA_ENCRYPTION_PLACEHOLDER
media_encryption_optimistic = SIP_MEDIA_ENCRYPTION_OPTIMISTIC_PLACEHOLDER
disallow = all
allow = ulaw,alaw,g722
direct_media = no
rtcp_mux = yes
; `rfc4733`, not `rfc2833`.
;
; A pre-existing bug found by bringing this file up: Asterisk 22 removed the `rfc2833` spelling, so
; every endpoint here failed to parse with "Error parsing dtmf_mode" and NEITHER dev extension
; existed. `pjsip show endpoints` listed only the carrier wizard. RFC 4733 obsoleted RFC 2833 in
; 2006 and the payload on the wire is identical; only the name changed.
dtmf_mode = rfc4733
callerid = "Dev 1001" <1001>
auth = 1001
aors = 1001
; The generated CIDR gate. Permit-all until an administrator writes a `registration`-scope entry
; and the generator runs — see pjsip_tls.conf for why there are two options rather than one.
acl = optimiq-registration
contact_acl = optimiq-registration

[1002]
type = aor
max_contacts = 2
remove_existing = yes
qualify_frequency = 30

[1002]
type = auth
auth_type = userpass
username = 1002
password = optimiq-dev-1002

[1002]
type = endpoint
context = optimiq-internal
transport = SIP_ENDPOINT_TRANSPORT_PLACEHOLDER
; Set to `sdes` by run.sh only when the endpoint transport is TLS; `no` otherwise. An `a=crypto`
; line in an SDP that crossed the network in the clear publishes the media key, so the two settings
; are one decision — see pjsip_tls.conf.
media_encryption = SIP_MEDIA_ENCRYPTION_PLACEHOLDER
media_encryption_optimistic = SIP_MEDIA_ENCRYPTION_OPTIMISTIC_PLACEHOLDER
disallow = all
allow = ulaw,alaw,g722
direct_media = no
rtcp_mux = yes
; `rfc4733`, not `rfc2833`.
;
; A pre-existing bug found by bringing this file up: Asterisk 22 removed the `rfc2833` spelling, so
; every endpoint here failed to parse with "Error parsing dtmf_mode" and NEITHER dev extension
; existed. `pjsip show endpoints` listed only the carrier wizard. RFC 4733 obsoleted RFC 2833 in
; 2006 and the payload on the wire is identical; only the name changed.
dtmf_mode = rfc4733
callerid = "Dev 1002" <1002>
auth = 1002
aors = 1002
acl = optimiq-registration
contact_acl = optimiq-registration
