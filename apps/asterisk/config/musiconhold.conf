; Music on hold — the FALLBACK that ships in the image.
;
; This file declares one class, `default`, pointing at the sounds directory the image already has.
; It exists because `res_musiconhold` with zero classes is the worst available failure: it logs
; nothing an operator can act on, and every `Hold` plays silence.
;
; Tenant hold-music classes are NOT here. They live in the `moh_class` table, they are created and
; their audio uploaded through the admin UI, and they reach this container as a GENERATED file:
;
;   PBX_DATABASE_URL=… PBX_MEDIA_OBJECT_ROOT=… \
;     pnpm --filter @optimiq-voice/api generate:musiconhold
;
; which writes `<object root>/moh/musiconhold.conf`. `run.sh` copies that over this file at start if
; the object store is mounted, so a container restart is always enough to pick up a change. To apply
; one without a restart:
;
;   asterisk -rx 'module reload res_musiconhold.so'
;
; See `apps/asterisk/README.md` (Music on hold) for the mount and the whole argument.

[default]
mode=files
directory=/usr/share/asterisk/moh
sort=alpha
