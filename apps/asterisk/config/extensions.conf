; ==============================================================================
; Optimiq Voice — the call engine's Stasis entry points
; ==============================================================================
;
; `apps/engine` connects to ARI as the application named by its `ARI_APP`
; variable (default `optimiq-engine`) and does ALL routing itself from the
; compiled routing artifact. The dialplan's only job here is to hand the channel
; over with enough context for the engine to know whose call it is.
;
; Three channel variables carry that context, and the engine reads exactly them:
;
;   OPTIMIQ_ORG_ID          the organization UUID. WITHOUT IT THE CALL IS
;                           REJECTED — the engine will not guess a tenant,
;                           because a mis-attributed call is both a billing
;                           error and an isolation breach.
;   OPTIMIQ_CALL_DIRECTION  inbound | outbound | internal
;   OPTIMIQ_ROUTING_CONTEXT which resolver to run: inbound | internal | outbound
;
; ------------------------------------------------------------------------------
; Setting OPTIMIQ_ORG_ID
; ------------------------------------------------------------------------------
;
; DEVELOPMENT (what these contexts do): the org is read from the container's
; environment with ${ENV(...)}, so `compose.yaml` sets it once —
;
;     asterisk:
;       environment:
;         OPTIMIQ_DEV_ORG_ID: 0195c0f0-1c2f-7000-8000-0000000000aa
;
; and nothing in this file has a tenant id baked into it.
;
; PRODUCTION: the org belongs to the DID, and the mapping lives in the control
; plane. Two supported shapes, neither of which is implemented yet:
;
;   1. The SIP edge (`apps/sipd` / Routr) already knows which tenant a trunk
;      belongs to and sets an `X-Optimiq-Org-Id` header; this context would read
;      it with ${PJSIP_HEADER(read,X-Optimiq-Org-Id)}.
;   2. The engine looks the DID up itself in a `did -> org` index.
;
; THE INDEX DOES NOT EXIST YET. See `apps/engine/README.md` §"Known gaps".
; Until one of those lands, a multi-tenant deployment cannot use these contexts.

; The handover is written out per pattern rather than factored into a GoSub, and
; that is not an oversight. `Stasis()` hands the channel over with the dialplan
; position it is standing on, and inside a GoSub that position is the SUBROUTINE's
; — so the engine would receive `exten = start` for every call and resolve every
; DID as unallocated. Four copies of six lines is the price of the destination
; number surviving the handover.
;
; Priority 4 is the GotoIf target: an org already on the channel wins, so a
; future SIP edge that resolved the tenant properly is not overwritten by the
; development default.

[optimiq-inbound]
exten => _+X.,1,NoOp(Optimiq inbound E.164: ${EXTEN})
  same => n,GotoIf($["${OPTIMIQ_ORG_ID}" != ""]?4)
  same => n,Set(OPTIMIQ_ORG_ID=${ENV(OPTIMIQ_DEV_ORG_ID)})
  same => n,Set(OPTIMIQ_CALL_DIRECTION=inbound)
  same => n,Set(OPTIMIQ_ROUTING_CONTEXT=inbound)
  ; A backstop, not a policy: a channel the engine loses track of must not live
  ; forever holding a media port.
  same => n,Set(TIMEOUT(absolute)=14400)
  same => n,Stasis(${ENV(OPTIMIQ_ARI_APP)})
  same => n,Hangup()
exten => _X.,1,NoOp(Optimiq inbound: ${EXTEN})
  same => n,GotoIf($["${OPTIMIQ_ORG_ID}" != ""]?4)
  same => n,Set(OPTIMIQ_ORG_ID=${ENV(OPTIMIQ_DEV_ORG_ID)})
  same => n,Set(OPTIMIQ_CALL_DIRECTION=inbound)
  same => n,Set(OPTIMIQ_ROUTING_CONTEXT=inbound)
  same => n,Set(TIMEOUT(absolute)=14400)
  same => n,Stasis(${ENV(OPTIMIQ_ARI_APP)})
  same => n,Hangup()

; Where registered extensions land (`context = optimiq-internal` on the demo
; endpoints). Internal resolution does NOT fall through to outbound implicitly —
; the engine asks for both, in that order, and the second call is where the
; toll-class gate applies.
[optimiq-internal]
exten => _X.,1,NoOp(Optimiq internal: ${EXTEN} from ${CALLERID(num)})
  same => n,GotoIf($["${OPTIMIQ_ORG_ID}" != ""]?4)
  same => n,Set(OPTIMIQ_ORG_ID=${ENV(OPTIMIQ_DEV_ORG_ID)})
  same => n,Set(OPTIMIQ_CALL_DIRECTION=internal)
  same => n,Set(OPTIMIQ_ROUTING_CONTEXT=internal)
  same => n,Set(TIMEOUT(absolute)=14400)
  same => n,Stasis(${ENV(OPTIMIQ_ARI_APP)})
  same => n,Hangup()
exten => _*X.,1,NoOp(Optimiq feature code: ${EXTEN})
  same => n,GotoIf($["${OPTIMIQ_ORG_ID}" != ""]?4)
  same => n,Set(OPTIMIQ_ORG_ID=${ENV(OPTIMIQ_DEV_ORG_ID)})
  same => n,Set(OPTIMIQ_CALL_DIRECTION=internal)
  same => n,Set(OPTIMIQ_ROUTING_CONTEXT=internal)
  same => n,Set(TIMEOUT(absolute)=14400)
  same => n,Stasis(${ENV(OPTIMIQ_ARI_APP)})
  same => n,Hangup()

; A dial target that always answers.
;
; Not reachable from any inbound context and never dialled by the engine unless
; ENGINE_EXTENSION_DIAL_TEMPLATE is pointed at it. It exists so a call flow can
; be exercised without a registered device: by hand as an echo test, and by the
; engine's gated integration suite, which sets
;
;     ENGINE_EXTENSION_DIAL_TEMPLATE=Local/{number}@optimiq-loopback/n
;
; so that `extension` plan nodes resolve to something that picks up. A test that
; needed a softphone in CI would be a test nobody ran.
;
; The `/n` matters: it disables Local-channel optimization, which would otherwise
; masquerade the pair out of the call path once both ends are bridged and take
; the channel ids the caller is holding with it.
[optimiq-loopback]
exten => _X.,1,NoOp(Optimiq loopback answering for ${EXTEN})
  same => n,Answer()
  same => n,Playback(unavailable)
  same => n,Wait(60)
  same => n,Hangup()

; ==============================================================================
; Legacy Fonoster media controller — untouched.
; ==============================================================================

[local-ctx-common]
exten => start,1,NoOp(Common handler for local context)
  same => n,GotoIf($["${APP_REF}" != ""]?4)
  same => n,Set(APP_REF=${PJSIP_HEADER(read,X-App-Ref)})
  same => n,GotoIf($["${INGRESS_NUMBER}" != ""]?6)
  same => n,Set(INGRESS_NUMBER=${CUT(CUT(PJSIP_HEADER(read,To),@,1),:,2)})
  same => n,GotoIf($["${CALL_DIRECTION}" != ""]?8)
  same => n,Set(CALL_DIRECTION=${PJSIP_HEADER(read,X-Call-Direction)})
  same => n,GotoIf($["${CALL_REF}" != ""]?10)
  same => n,Set(CALL_REF=${PJSIP_HEADER(read,X-Call-Ref)})
  same => n,Set(TIMEOUT(absolute)=3600)
  same => n,MixMonitor(${APP_REF}_${UNIQUEID}.wav)
  same => n,Stasis(mediacontroller)
  same => n,Hangup()

[local-ctx]
exten => _+X.,1,NoOp(E.164 Number: ${EXTEN})
  same => n,GoSub(local-ctx-common,start,1)
  same => n,Hangup()
exten => _X.,1,NoOp(Non-E.164 Number: ${EXTEN})
  same => n,GoSub(local-ctx-common,start,1)
  same => n,Hangup()
exten => voice,1,NoOp(Directly connecting to the Voice server)
  same => n,GoSub(local-ctx-common,start,1)
  same => n,Hangup()