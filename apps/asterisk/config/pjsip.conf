[system]
accept_multiple_sdp_answers = yes

[global]
endpoint_identifier_order = ip, username

[transport-tcp]
type = transport
protocol = tcp
bind = SIP_BINDADDR_PLACEHOLDER
;
; No `acl` here, and that is a fact about PJSIP rather than a choice: the `transport` object has no
; ACL option at all (res_pjsip answers a transport-level `acl =` with "Could not find option
; suitable for category 'transport-tcp'" and then REFUSES TO CREATE THE TRANSPORT — a config error
; that takes the whole SIP edge down, which is how this was found).
;
; The CIDR gate therefore attaches per ENDPOINT — `acl` and `contact_acl` — which is where
; res_pjsip puts it and, as it happens, the better seam: an endpoint knows which scope and which
; tenant it belongs to, and a socket does not. See `apps/api/src/pbx/security/acl-conf.ts`.

; The TLS transport and the encrypted endpoint template. `run.sh` removes the file unless
; SIP_TLS_ENABLED=true (and refuses to start if it is true and the certificate is missing), on the
; same `#tryinclude` discipline as the dev endpoints below — see pjsip_tls.conf's header for why a
; TLS block cannot be made conditional in place.
#tryinclude pjsip_tls.conf

; Development-only registrable extensions. `run.sh` removes the file unless
; OPTIMIQ_DEV_ENDPOINTS=true, and `#tryinclude` tolerates its absence — so the
; default on every box is "no static credentials", and turning them on is an
; explicit act rather than something somebody has to remember to undo.
#tryinclude pjsip_dev_endpoints.conf
