; Asterisk core settings.
;
; Alpine installs the Asterisk data directory (sounds, rest-api, static-http,
; images) under /usr/share/asterisk as of Alpine 3.22, while the compiled-in
; default remains /var/lib/asterisk. Pin astdatadir so that:
;   * sound:unavailable resolves to /usr/share/asterisk/sounds/en
;   * res_ari finds /usr/share/asterisk/rest-api and can serve /ari/api-docs,
;     which node-ari-client fetches on connect
; Everything else keeps the compiled-in defaults (astdbdir/astkeydir stay in
; /var/lib/asterisk, recordings stay in /var/spool/asterisk/monitor).
[directories]
astdatadir => /usr/share/asterisk
