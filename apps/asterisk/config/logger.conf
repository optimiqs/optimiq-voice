; ==============================================================================
; LOGGING — AND THE SECURITY CHANNEL, WHICH IS THE POINT OF THIS FILE
; ==============================================================================
;
; There was no `logger.conf` in this image at all, so Asterisk used its compiled-in defaults: the
; console got `notice,warning,error` and nothing was written anywhere else. That is why the parity
; audit's row 1.25 could say the platform has no attack log — every authentication failure the SIP
; stack already detects was being computed, formatted, and thrown away.
;
; THE SECURITY CHANNEL
; --------------------
; `security` is a first-class Asterisk log level fed by the Security Events framework
; (`res_security_log.so`): `res_pjsip`'s authenticator raises `InvalidAccountID`,
; `InvalidPassword`, `ChallengeSent`, `ChallengeResponseFailed`, `FailedACL`, `InvalidTransport`
; and friends, each as a structured, single-line, key-value record with `AccountID`,
; `RemoteAddress`, `SessionID` and a `SequenceNumber`. It is precisely the feed fail2ban's stock
; Asterisk jail parses, and it is what a log shipper should be pointed at.
;
; It gets its OWN file rather than a level on `messages`. Two reasons, in this order:
;
; 1. A security feed is parsed by machines, and mixing it with free-form NOTICE lines from every
;    other module means the parser's regex is doing double duty as a filter. `fail2ban`'s
;    `asterisk.conf` filter exists because somebody had to write that regex once already.
; 2. Retention differs. An attack record is worth keeping when a debug log is not, and separating
;    the streams is what lets an operator say so with logrotate rather than with grep.
;
; The file is `/var/log/asterisk/security`, which is the path fail2ban's shipped Asterisk jail
; already defaults to — chosen so a deployment that wants fail2ban configures a jail rather than a
; log path.
;
; WHAT STILL HAS TO HAPPEN OUTSIDE THIS FILE
; ------------------------------------------
; This makes the events EXIST. Getting them off the box is a deployment decision with two shapes,
; and both are named rather than pretended away:
;
;   * fail2ban (or CrowdSec) watching this file and writing firewall rules. That is the response
;     half — nothing in Asterisk blocks an address by itself.
;   * A shipper turning the same lines into rows in `sip_auth_event`, the API-side ledger this
;     wave adds (`packages/pbx-db/src/schema/security-schema.ts`). The API records the failures IT
;     observes directly today — provisioning token, ACL and rate-limit refusals — and the SIP-plane
;     ingest is the follow-up, because `apps/api` has neither an AMI client nor a reachable AMI
;     port in the shipped compose stack. `scripts/generate-musiconhold.ts` records the same three
;     constraints for the same reason.
;
; `timestamp = yes` on every channel: the container's stdout is collected by Docker, which stamps
; its own arrival time, and a line that has been through a buffer is no longer evidence of when it
; happened.

[general]
dateformat = %F %T.%3q
; A rotation Asterisk performs itself, so a long-running container does not grow one file forever
; on a deployment whose logrotate never learned about this path.
rotatestrategy = rotate

[logfiles]
; The container's stdout, which is what `docker compose logs` shows. Deliberately NOT carrying
; `security`: those lines are for the file and the shipper, and duplicating them here would put an
; attack's full volume into the same stream an operator reads to see whether calls are working.
console => notice,warning,error

; The ordinary operational log.
messages => notice,warning,error

; The attack log. One level, one file, one parser.
security => security
