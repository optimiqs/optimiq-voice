; ==============================================================================
; SIP-TLS TRANSPORT AND THE ENCRYPTED ENDPOINT TEMPLATE
; ==============================================================================
;
; Until this file existed, `pjsip.conf` declared exactly one transport — `[transport-tcp]` — and
; every registration password and every SDP on this box crossed the network in the clear. The
; parity audit (plans/parity-audit-2026-08-11.md, rows 1.9 and 1.10, ranked gap #1) says so in
; those words. This is the Asterisk half of the fix; `apps/sipd`'s listener is the other half and
; belongs to the INVITE ladder, not here.
;
; WHY A SEPARATE FILE RATHER THAN A BLOCK IN pjsip.conf
; -----------------------------------------------------
; The same reason `config/nats-tls.conf` is a separate file and `compose.tls.yaml` a separate
; overlay, recorded there at length: a TLS block is not conditional in the config language. A
; `[transport-tls]` whose `cert_file` does not exist does not degrade — res_pjsip fails to load the
; transport and logs it once, which on a fresh clone is a media server that answers nothing and a
; developer reading pjproject errors. So the conditional moves up one level, to whether the file is
; present at all.
;
; `run.sh` DELETES this file unless `SIP_TLS_ENABLED=true`, and `pjsip.conf` reaches it with
; `#tryinclude`, which tolerates the absence. That is the identical discipline
; `pjsip_dev_endpoints.conf` already uses, and it fails safe in the same direction: the box that
; was never told about TLS is the box with no half-configured TLS listener on it.
;
; And when TLS IS asked for and the certificates are missing, `run.sh` REFUSES TO START rather than
; falling back to plaintext. An operator who asked for TLS and silently got cleartext is the one
; failure mode a security feature must never have.
;
; THE CERTIFICATE
; ---------------
; `cert_file` / `priv_key_file` are paths INSIDE the container, from `SIP_TLS_CERT_FILE` and
; `SIP_TLS_PRIV_KEY_FILE`, defaulting to `/etc/asterisk/certs/`. Development material comes from
; `config/certs/generate-dev-certs.sh`, which now signs an `asterisk` leaf alongside the broker's:
; a phone verifies the SIP server's hostname against the SAN, so the two leaves cannot share one
; certificate. Production is an operator mount of real material at the same two paths — there is no
; code path that generates a production key.
;
; `verify_client = no` is deliberate and is not laziness. Mutual TLS on the client side would mean
; issuing and provisioning a client certificate to every desk phone, which is a certificate
; lifecycle this platform does not have; the phone is authenticated by SIP digest over the
; encrypted channel, which is what every deployment of this shape does. `verify_server` governs the
; leg where WE are the client (outbound TLS to a carrier) and is left at the operator's control
; through `SIP_TLS_VERIFY_SERVER` — a trunk to a real carrier should turn it on and supply a CA
; list.
;
; SRTP
; ----
; `media_encryption = sdes` on the template below, with `media_encryption_optimistic = yes`.
;
; SDES rather than DTLS-SRTP because the fleet is desk phones, not browsers. Every vendor in
; `apps/api/src/provisioning/catalog/templates/` — Yealink, Poly, Grandstream, Fanvil, Snom —
; implements SDES (`a=crypto`) and gates it on the SIP transport being TLS; DTLS-SRTP is the
; WebRTC profile and support across that same hardware is partial at best. When the WebRTC
; softphone lands (W14) it brings `media_encryption = dtls` on its own endpoint template, because
; that is the profile a browser speaks.
;
; SDES is only sound over TLS, and that is the whole reason this setting lives in the TLS file: the
; key travels in the SDP, so an `a=crypto` line over UDP or TCP publishes the media key in
; cleartext and is worse than no encryption at all, because it looks encrypted. Nothing outside
; this file sets `media_encryption`.
;
; `optimistic` means: offer SRTP, accept a plain-RTP answer rather than failing the call. That is
; the right default for a mixed fleet — a handset two firmware revisions behind still works, and
; the calls that CAN be encrypted are — and it is the wrong default for a deployment that must be
; able to say "no media left here unencrypted". `SIP_MEDIA_ENCRYPTION_OPTIMISTIC=no` makes SRTP
; mandatory, and a phone that cannot do it then fails to set up media, visibly.
;
; THE RTP PATH, STATED HONESTLY
; -----------------------------
; This encrypts the leg between the phone and Asterisk. `apps/mediad` does not implement SRTP —
; `apps/mediad/internal/rtp/session.go` says so in its header — so any call that is bridged to a
; mediad-backed external-media leg is re-emitted as plain RTP on that hop. Recorded as a hard
; requirement on the mediad cutover in `plans/mediad-design.md`; it is not a gap this file can
; close.

[transport-tls]
type = transport
protocol = tls
bind = SIP_TLS_BINDADDR_PLACEHOLDER
cert_file = SIP_TLS_CERT_FILE_PLACEHOLDER
priv_key_file = SIP_TLS_PRIV_KEY_FILE_PLACEHOLDER
ca_list_file = SIP_TLS_CA_FILE_PLACEHOLDER
; The floor, not the ceiling: `tlsv1_2` in pjproject means "1.2 or better", so a phone that speaks
; 1.3 negotiates 1.3. Set `SIP_TLS_METHOD=tlsv1_3` on a fleet that is entirely modern.
method = SIP_TLS_METHOD_PLACEHOLDER
verify_client = no
verify_server = SIP_TLS_VERIFY_SERVER_PLACEHOLDER

; ------------------------------------------------------------------------------
; The endpoint template TLS endpoints inherit.
; ------------------------------------------------------------------------------
;
; A PJSIP template (`(!)`), so an endpoint says `(optimiq-endpoint-tls)` and gets the transport and
; the media policy together. That pairing is the point: `media_encryption` and `transport` are one
; decision, and an endpoint that could set the first without the second is an endpoint somebody
; will eventually point at UDP with `sdes` still on it.
; Its `media_encryption` comes from `SIP_TLS_MEDIA_ENCRYPTION` (default `sdes`) and NOT from the
; `SIP_MEDIA_ENCRYPTION` that the static dev endpoints read. Two variables because they answer two
; questions: this template is on TLS by construction, so SRTP is always sound here, while a dev
; endpoint's setting has to be derived from whichever transport it was pointed at.
[optimiq-endpoint-tls](!)
type = endpoint
transport = transport-tls
media_encryption = SIP_TLS_MEDIA_ENCRYPTION_PLACEHOLDER
media_encryption_optimistic = SIP_MEDIA_ENCRYPTION_OPTIMISTIC_PLACEHOLDER
; A phone behind NAT answers from the port it sent from, not the one it advertised. Without this a
; TLS-and-SRTP call sets up and carries no audio, which is the hardest failure of the lot to read.
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; The generated CIDR gate, from `sip_acl_entry` via `acl.conf`. Two options, not one, because they
; guard two different addresses:
;
;   acl          the source address the request ARRIVED from
;   contact_acl  the address inside the Contact header the device asks us to send calls TO
;
; The second is the toll-fraud one. A device that authenticates from its own office and then
; registers a Contact pointing at somebody else's host has turned this platform into a relay, and
; nothing about the source address would show it.
;
; The reference is unconditional because a DANGLING named-ACL reference is fail-OPEN — res_pjsip
; logs "Could not find ACL" once and then filters nothing. The baked `acl.conf` declares the name
; as permit-all and the generator always emits the section, so it always resolves.
acl = optimiq-registration
contact_acl = optimiq-registration
