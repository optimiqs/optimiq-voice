; ==============================================================================
; NAMED CIDR ACLs — THE BAKED FALLBACK
; ==============================================================================
;
; This file used to be the literal line `; Placeholder`, which the parity audit records as ranked
; gap #4 / row 1.23: `sip_acl_entry` was created as a table and wired to nothing, while
; "toll fraud rule #1" in the FreeSWITCH inventory went unenforced.
;
; The real file is GENERATED from `sip_acl_entry` by
;
;     pnpm --filter @optimiq-voice/api generate:sip-acl
;
; into `<object store>/acl/acl.conf`, and `run.sh` copies it over this one at start — exactly the
; arrangement `musiconhold.conf` already uses, and for the same reasons its generator's header
; states: `apps/api` has no ARI or AMI client, Asterisk's control ports are not reachable from the
; API in the shipped stack, and a file the container picks up is the delivery the plan allows.
;
; WHERE THESE NAMES ARE REFERENCED
; --------------------------------
; From ENDPOINTS, not from transports. The PJSIP `transport` object has no ACL option at all — a
; transport-level `acl =` is not ignored, it makes res_pjsip refuse to create the transport and
; takes the SIP edge down with it.
;
;   optimiq-registration   pjsip_dev_endpoints.conf and pjsip_tls.conf's `[optimiq-endpoint-tls]`,
;                          on BOTH `acl` (where the request came from) and `contact_acl` (where
;                          the device is asking us to send calls). The second is the toll-fraud
;                          one: a device that authenticates from its own office and registers a
;                          Contact pointing at a third-party host has made this platform a relay.
;   optimiq-trunk          pjsip_wizard.conf's `endpoint/acl`, the carrier leg.
;
; WHY THE SECTIONS EXIST HERE AT ALL
; ----------------------------------
; Because a dangling named-ACL reference is FAIL-OPEN: if the name does not resolve, Asterisk logs
; one line and applies no filtering, which is a security control that appears to be configured and
; is not. Declaring the names here, permit-all, means every reference always resolves and a
; deployment that has never run the generator behaves precisely as it did before the references
; existed.
;
; So the safety property is: this file NEVER narrows anything. Narrowing is what the generator
; does, from rows an administrator wrote.
;
; A note on Asterisk's evaluation order, because it is the opposite of the table's: rules are
; applied in sequence and the LAST match wins. The generator therefore emits its rows in reverse
; precedence order. See `apps/api/src/pbx/security/acl-conf.ts`.

[optimiq-registration]
permit = 0.0.0.0/0.0.0.0
permit = ::/0

[optimiq-trunk]
permit = 0.0.0.0/0.0.0.0
permit = ::/0
