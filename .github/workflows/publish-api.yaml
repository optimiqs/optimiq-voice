name: publish api

on:
  workflow_call:
    inputs:
      version:
        description: "Version to use for Docker tags"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to use for Docker tags"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Get version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "LERNA_VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          else
            lerna_version=$(node -p "require('./lerna.json').version")
            echo "LERNA_VERSION=$lerna_version" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Publish the API to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            optimiq-voice/api:latest
            optimiq-voice/api:${{ env.LERNA_VERSION }}

      - name: Install dependencies for integration tests
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Starting services for integration tests
        run: |
          pnpm run generate:keypair
          cp config/integrations.example.json config/integrations.json
          cp .env.example .env
          echo "" >> .env
          echo "DOCKER_HOST_ADDRESS=127.0.0.1" >> .env
          sed -i "s|ROUTR_EXTERNAL_ADDRS=.*|ROUTR_EXTERNAL_ADDRS=127.0.0.1|g" .env
          sed -i "s|RTPENGINE_PUBLIC_IP=.*|RTPENGINE_PUBLIC_IP=127.0.0.1|g" .env
          sed -i "s|ASTERISK_SIPPROXY_HOST=.*|ASTERISK_SIPPROXY_HOST=127.0.0.1|g" .env
          sed -i "s|API_SMTP_HOST=.*|API_SMTP_HOST=mailhog|g" .env
          sed -i "s|API_SMTP_PORT=.*|API_SMTP_PORT=1025|g" .env
          sed -i "s|API_SMTP_SECURE=.*|API_SMTP_SECURE=false|g" .env
          docker compose -f compose.yaml -f compose.dev.yaml up -d envoy routr nats postgres api asterisk mailhog

      - name: Waiting for services to be ready
        run: |
          sleep 120 # Enough time for Routr to start in a low spec machine
          docker ps -a

      - name: Wait for api gRPC port
        run: |
          echo "Waiting for api on port 50051..."
          for i in $(seq 1 45); do
            if node -e "require('net').createConnection(50051,'127.0.0.1',()=>process.exit(0)).on('error',()=>process.exit(1))" 2>/dev/null; then
              echo "API is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Timeout: api did not become ready on port 50051."
          exit 1

      - name: Run integration tests for the SDK
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 5
          retry_wait_seconds: 30
          max_attempts: 2
          command: pnpm run integration

      - name: API logs (on failure)
        if: failure()
        run: docker compose -f compose.yaml -f compose.dev.yaml logs api
