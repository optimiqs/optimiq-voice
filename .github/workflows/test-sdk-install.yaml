name: test sdk install

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/common/**"
      - "packages/types/**"
      - "packages/sdk/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install and build the SDK with pnpm
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Pack the SDK
        run: |
          pnpm pack
        working-directory: packages/sdk

      - name: Upload SDK tarball
        uses: actions/upload-artifact@v4
        with:
          name: sdk-tarball
          path: packages/sdk/optimiq-voice-sdk-*.tgz

  install-with-yarn:
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        node-version: ["22.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Yarn
        run: npm install -g yarn

      - name: Download SDK tarball
        uses: actions/download-artifact@v4
        with:
          name: sdk-tarball

      - name: Install the SDK with yarn
        run: |
          mkdir new_project
          cd new_project
          yarn init -y
          yarn add ../optimiq-voice-sdk-*.tgz

  install-with-npm:
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        node-version: ["22.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Download SDK tarball
        uses: actions/download-artifact@v4
        with:
          name: sdk-tarball

      - name: Install the SDK with npm
        run: |
          mkdir new_project
          cd new_project
          npm init -y
          npm install ../optimiq-voice-sdk-*.tgz
