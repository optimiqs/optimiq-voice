name: check lint and format

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `lint` is oxlint and `format:check` is oxfmt — two separate tools, so two separate steps.
      # They used to be a single step labelled "includes format checking" that only ran oxlint,
      # which meant formatting was never actually verified in CI.
      - name: Run lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check
