# Go data plane: the checks that only make sense when the go.work modules themselves change —
# gofmt, vet, and the docker-backed integration suites.
#
# The plain `go test` for both modules and the events codegen drift gate live in `ci.yaml`, which
# runs unfiltered on every PR and push, so they are not repeated here.
name: go data plane

on:
  pull_request:
    branches:
      - main
      - "feat/**"
    paths:
      - "apps/sipd/**"
      - "apps/mediad/**"
      - "packages/events/**"
      - "packages/events-go/**"
      - "packages/runtime-go/**"
      - "config/nats.conf"
      - "compose.voice.yaml"
      - ".scripts/verify-media-cluster.mjs"
      - ".scripts/verify-browser-calling.mts"
      - ".scripts/fixtures/browser-softphone.ts"
      - "apps/web/lib/softphone/**"
      - "apps/engine/src/media/**"
      - "apps/engine/src/nats/sipd-command.client.ts"
      - "go.work"
      - ".github/workflows/go-data-plane.yaml"
  workflow_dispatch:

# This workflow installs Chromium and builds the engine. Without a group every push to an open PR
# stacks another full run on top of the one already going.
concurrency:
  group: go-data-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      # apps/mediad is named here alongside the other two. Its `paths` filter above already brought
      # this workflow to life on a mediad change; the steps then checked everything except the module
      # that changed, which is the worst shape a gate can have — green, and about the wrong code.
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l ./apps/sipd ./apps/mediad ./packages/events-go ./packages/runtime-go)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      # `./...` from the workspace root is not a module path; the modules are named explicitly.
      - name: Vet
        run: go vet ./apps/sipd/... ./apps/mediad/... ./packages/events-go/... ./packages/runtime-go/...

      - name: Setup Node for browser verification
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/voice-browser" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/voice-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell

      - name: Verify encrypted browser audio and recordings
        env:
          RUN_BROWSER_WEBRTC: "1"
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/voice-browser/node_modules/playwright" go test -race -run TestChromiumWebRTCAudioAndRecording -v ./apps/mediad/internal/control

      - name: Setup calling test dependencies
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Build engine dependencies for real browser calls
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @optimiq-voice/engine... run build

      - name: Verify SIP browser calling and relay-only UDP and TCP
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/voice-browser/node_modules/playwright"
          pnpm exec tsx .scripts/verify-browser-calling.mts
          BROWSER_TURN_PUBLIC_IP="$(hostname -I | awk '{print $1}')"
          export BROWSER_TURN_PUBLIC_IP
          BROWSER_TURN_TRANSPORT=udp pnpm exec tsx .scripts/verify-browser-calling.mts
          BROWSER_TURN_TRANSPORT=tcp pnpm exec tsx .scripts/verify-browser-calling.mts

      # Integration suites need docker and are gated twice (build tag + env var), so they run here
      # explicitly rather than as a side effect of `go test ./...`.
      - name: Integration tests
        env:
          RUN_SIPD_INTEGRATION: "1"
        run: go test -tags integration -timeout 10m ./apps/mediad/... ./apps/sipd/...
        # apps/mediad is in the package list and has no `integration`-tagged files today, so this
        # runs its ordinary tests a second time — cheap, and it means a mediad integration suite is
        # covered by the gate on the day it is WRITTEN rather than on the day somebody remembers to
        # add it here. Named alongside sipd rather than given its own step precisely because there
        # is no second gate variable to set: `RUN_SIPD_INTEGRATION` guards sipd's own files, and
        # inventing a `RUN_MEDIAD_INTEGRATION` that nothing reads would be a lie in a config file.
