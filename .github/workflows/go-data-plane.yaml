# Go data plane: build, vet and test the go.work modules, and gate cross-language contract drift.
#
# Separate from `unit tests` on purpose — that job is a pnpm/Node pipeline, and this one needs a Go
# toolchain it would otherwise install for every TypeScript change.
#
# The drift gate is the mechanism plan §3.5 asks for: "single source: JSON Schema emitted from Zod;
# CI checks cross-language drift". It regenerates packages/events/schema and packages/events-go from
# the Zod schemas and fails if anything differs from what is committed, so a schema change that
# forgets codegen cannot merge.
name: go data plane

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/sipd/**"
      - "apps/mediad/**"
      - "packages/events/**"
      - "packages/events-go/**"
      - "go.work"
      - ".github/workflows/go-data-plane.yaml"
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l ./apps/sipd ./packages/events-go)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      # `./...` from the workspace root is not a module path; the modules are named explicitly.
      - name: Vet
        run: go vet ./apps/sipd/... ./packages/events-go/...

      - name: Test
        run: go test ./apps/sipd/... ./packages/events-go/...

      # Integration suites need docker and are gated twice (build tag + env var), so they run here
      # explicitly rather than as a side effect of `go test ./...`.
      - name: Integration tests
        env:
          RUN_SIPD_INTEGRATION: "1"
        run: go test -tags integration -timeout 10m ./apps/sipd/...

  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # gofmt is what makes the generated Go canonical, so the codegen refuses to run without it.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate the contract and fail on drift
        run: pnpm --filter @optimiq-voice/events codegen:check
