  fastify: ^5.8.5
  # The only file-upload path in the platform: the PBX media library (MOH files, prompts,
  # voicemail greetings). Fastify ships no multipart parser of its own, and the alternative —
  # a hand-rolled `addContentTypeParser` over a raw body — would put boundary parsing, part
  # limits and stream backpressure in application code. `@fastify/multipart` is the official
  # plugin, tracks `fastify@5`, and is registered once in `pbx-bootstrap.ts`.
  "@fastify/multipart": ^10.1.0
  class-validator: ^0.14.3
  class-transformer: ^0.5.1
