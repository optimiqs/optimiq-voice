allowBuilds:
  core-js-pure: true
  esbuild: true
  grpc-tools: true
  msgpackr-extract: true
  nx: true
  onnxruntime-node: true
  protobufjs: true
  protoc-gen-grpc-web: true
  protoc-gen-js: true
  sharp: true

# Pinned dependency catalog (oikos-care conventions; see plans/reference/oikos-conventions.md)
catalog:
