packages:
  - "apps/*"
  - "packages/*"

sharedWorkspaceLockfile: true
linkWorkspacePackages: false
saveWorkspaceProtocol: rolling
injectWorkspacePackages: false

# drizzle-kit imports drizzle-orm internals but does not declare it, so it would resolve the
# legacy 0.45.2 hoisted at the repository root instead of the importer's pinned version.
# Declaring the peer makes pnpm link the drizzle-orm each consumer actually depends on.
packageExtensions:
  drizzle-kit:
    peerDependencies:
      drizzle-orm: "*"

onlyBuiltDependencies:
  - core-js-pure
  - esbuild
  - grpc-tools
  - nx
  - onnxruntime-node
  - protobufjs
  - protoc-gen-grpc-web
  - protoc-gen-js
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - "@aws-sdk/checksums@3.1000.26"
  - "@aws-sdk/client-s3@3.1103.0"
  - "@aws-sdk/core@3.977.6"
