packages:
  - "apps/*"
  - "packages/*"

sharedWorkspaceLockfile: true
linkWorkspacePackages: false
saveWorkspaceProtocol: rolling
injectWorkspacePackages: false

# drizzle-kit imports drizzle-orm internals but does not declare it. The legacy 0.45.2 root pin it
# used to resolve against is gone, but the missing peer is still missing — declaring it keeps pnpm
# linking the drizzle-orm each importer actually depends on rather than whatever hoists first.
packageExtensions:
  drizzle-kit:
    peerDependencies:
      drizzle-orm: "*"

# Postinstall scripts are denied by default; these are the packages allowed to run one. Every entry
# that existed only for the deleted platform is gone: grpc-tools / protoc-gen-grpc-web /
# protoc-gen-js (the gRPC codegen toolchain), nx (the deleted lerna/nx release machinery),
# onnxruntime-node (autopilot's local inference) and core-js-pure (the dashboard's build).
#
# `protobufjs` and `sharp` STAY, and are no longer direct dependencies of anything: protobufjs
# arrives under `@grpc/grpc-js` via `@nestjs/microservices` (apps/api and apps/engine both use the
# NATS transport) and sharp arrives under `next` (apps/web). Dropping them turns `pnpm install`
# into a non-zero exit with ERR_PNPM_IGNORED_BUILDS.
onlyBuiltDependencies:
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - "@aws-sdk/checksums@3.1000.26"
  - "@aws-sdk/client-s3@3.1103.0"
  - "@aws-sdk/core@3.977.6"
  - "@aws-sdk/credential-provider-env@3.972.67"
  - "@aws-sdk/credential-provider-http@3.972.69"
  - "@aws-sdk/credential-provider-ini@3.973.12"
  - "@aws-sdk/credential-provider-login@3.972.74"
  - "@aws-sdk/credential-provider-node@3.972.78"
  - "@aws-sdk/credential-provider-process@3.972.67"
  - "@aws-sdk/credential-provider-sso@3.973.11"
  - "@aws-sdk/credential-provider-web-identity@3.972.73"
  - "@aws-sdk/middleware-sdk-s3@3.972.72"
  - "@aws-sdk/nested-clients@3.997.41"
  - "@aws-sdk/token-providers@3.1103.0"
  - "@rxjs/observable-polyfill@9.0.0-beta.0"
  - "@types/pg@8.20.4"
  - "@typescript/typescript-darwin-arm64@7.1.0-dev.20260805.1"
  - "@typescript/typescript-darwin-x64@7.1.0-dev.20260805.1"
  - "@typescript/typescript-linux-arm64@7.1.0-dev.20260805.1"
  - "@typescript/typescript-linux-arm@7.1.0-dev.20260805.1"
  - "@typescript/typescript-linux-x64@7.1.0-dev.20260805.1"
  - "@typescript/typescript-win32-arm64@7.1.0-dev.20260805.1"
  - "@typescript/typescript-win32-x64@7.1.0-dev.20260805.1"
  - rxjs@9.0.0-beta.0
  - tsx@4.23.7
  - typescript@7.1.0-dev.20260805.1

allowBuilds:
  esbuild: true
  grpc-tools: set this to true or false
  msgpackr-extract: true
  nx: set this to true or false
  protobufjs: set this to true or false
  protoc-gen-grpc-web: set this to true or false
  protoc-gen-js: set this to true or false
  sharp: set this to true or false

