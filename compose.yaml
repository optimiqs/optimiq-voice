name: optimiq-voice

services:
  dashboard:
    image: optimiq-voice/dashboard:0.17.1
    restart: unless-stopped
    expose:
      - 3030:3030
    environment:
      - SERVER_DASHBOARD_SESSION_SECRET

  api:
    image: optimiq-voice/api:0.17.1
    restart: unless-stopped
    environment:
      - API_APP_URL
      - API_ASTERISK_ARI_PROXY_URL
      - API_ASTERISK_ARI_SECRET
      - API_ASTERISK_ARI_USERNAME
      - API_AUTHZ_SERVICE_ENABLED
      - API_AUTHZ_SERVICE_HOST
      - API_AUTHZ_SERVICE_METHODS
      - API_AUTHZ_SERVICE_PORT
      - API_CLOAK_ENCRYPTION_KEY
      - API_DATABASE_URL
      - API_IDENTITY_DATABASE_URL
      - API_IDENTITY_ISSUER
      - API_IDENTITY_CONTACT_VERIFICATION_REQUIRED
      - API_IDENTITY_TWO_FACTOR_AUTHENTICATION_REQUIRED
      - API_IDENTITY_WORKSPACE_INVITE_EXPIRATION
      - API_IDENTITY_WORKSPACE_INVITE_FAIL_URL
      - API_IDENTITY_WORKSPACE_INVITE_URL
      - API_IDENTITY_OAUTH2_GITHUB_CLIENT_ID
      - API_IDENTITY_OAUTH2_GITHUB_CLIENT_SECRET
      - API_IDENTITY_OAUTH2_GITHUB_ENABLED
      - API_INFLUXDB_INIT_ORG
      - API_INFLUXDB_INIT_PASSWORD
      - API_INFLUXDB_INIT_TOKEN
      - API_INFLUXDB_INIT_USERNAME
      - API_INFLUXDB_URL
      - API_LOGS_FORMAT
      - API_LOGS_LEVEL
      - API_LOGS_TRANSPORT
      - API_NATS_URL
      - API_OWNER_EMAIL
      - API_OWNER_NAME
      - API_OWNER_PASSWORD
      - API_ROOT_DOMAIN
      - API_SMTP_AUTH_PASS
      - API_SMTP_AUTH_USER
      - API_SMTP_HOST
      - API_SMTP_PORT
      - API_SMTP_SECURE
      - API_SMTP_SENDER
      - API_SIGNALING_SERVER
      - API_TWILIO_ACCOUNT_SID
      - API_TWILIO_AUTH_TOKEN
      - API_TWILIO_PHONE_NUMBER
    expose:
      - 50051
    volumes:
      - ./.keys:/opt/optimiq-voice/keys:ro
      - ./config/integrations.json:/opt/optimiq-voice/integrations.json:ro

  autopilot:
    image: optimiq-voice/autopilot:0.17.1
    restart: unless-stopped
    expose:
      - 50061
    environment:
      - AUTOPILOT_AWS_S3_ACCESS_KEY_ID
      - AUTOPILOT_AWS_S3_ENDPOINT
      - AUTOPILOT_AWS_S3_REGION
      - AUTOPILOT_AWS_S3_SECRET_ACCESS_KEY
      - AUTOPILOT_CONVERSATION_PROVIDER
      - AUTOPILOT_KNOWLEDGE_BASE_ENABLED
      - AUTOPILOT_LOGS_FORMAT
      - AUTOPILOT_LOGS_LEVEL
      - AUTOPILOT_LOGS_TRANSPORT
      - AUTOPILOT_OPENAI_API_KEY
      - AUTOPILOT_RECORDING_BASE_URL
      - AUTOPILOT_UNSTRUCTURED_API_KEY
      - AUTOPILOT_UNSTRUCTURED_API_URL
    volumes:
      - ./config/integrations.json:/opt/optimiq-voice/integrations.json:ro

  routr:
    image: optimiq-voice/routr-one:2.13.22
    restart: unless-stopped
    labels:
      - "autoheal=true"
    environment:
      DATABASE_URL: ${ROUTR_DATABASE_URL}
      EXTERNAL_ADDRS: ${ROUTR_EXTERNAL_ADDRS}
      LOGS_FORMAT: ${ROUTR_LOGS_FORMAT}
      LOGS_LEVEL: ${ROUTR_LOGS_LEVEL}
      LOGS_TRANSPORT: ${ROUTR_LOGS_TRANSPORT}
      NATS_PUBLISHER_ENABLED: true
      NATS_PUBLISHER_URL: ${ROUTR_NATS_PUBLISHER_URL}
      RTPENGINE_HOST: ${ROUTR_RTPENGINE_HOST}
      START_INTERNAL_DB: "false"
      CONNECT_VERIFIER_PUBLIC_KEY_PATH: /etc/routr/keys/public.pem
    expose:
      - 51907
      - 51908
    ports:
      - 5060:5060/udp
      - 5060-5063:5060-5063
    # Add this healthcheck along with the autoheal container as we are having issues with Routr crashing out.
    # We will need a proper fix for this before we can remove this healthcheck.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'printf "REGISTER sip:localhost SIP/2.0\r\nVia: SIP/2.0/UDP 127.0.0.1:5061;branch=z9hG4bKhealth\r\nFrom: <sip:health@localhost>;tag=1234\r\nTo: <sip:health@localhost>\r\nCall-ID: health-$$@localhost\r\nCSeq: 1 REGISTER\r\nMax-Forwards: 70\r\nContent-Type: text/plain\r\nContent-Length: 4\r\n\r\nping" | nc -u -w 1 127.0.0.1 5060 | grep -Eq "^SIP/2.0"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    volumes:
      - ./.keys/public.pem:/etc/routr/keys/public.pem:ro

  # RTPEngine uses a range of ports to handle RTP traffic. Because exposing a large range of ports
  # is not possible in Docker, we need to use network_mode: host.
  #
  # Unfortunately, network_mode: host is not supported for Windows or Mac.
  # In those cases, we need to use a different approach.
  #
  # By default we are opening a small range of ports (10000-10100) to handle RTP traffic.
  # However, this is not enough for production environments.
  #
  # We recommend that when using Linux you use network_mode: host and remove the ports section.
  rtpengine:
    image: optimiq-voice/rtpengine:0.3.17
    restart: unless-stopped
    platform: linux/x86_64
    ports:
      - 10000-10100:10000-10100/udp
      - 8080:8080
    environment:
      PORT_MAX: ${RTPENGINE_PORT_MAX}
      PORT_MIN: ${RTPENGINE_PORT_MIN}
      PUBLIC_IP: ${RTPENGINE_PUBLIC_IP}

  asterisk:
    image: optimiq-voice/asterisk:22
    restart: unless-stopped
    environment:
      ARI_PROXY_URL: ${ASTERISK_ARI_PROXY_URL}
      ARI_SECRET: ${ASTERISK_ARI_SECRET}
      ARI_USERNAME: ${ASTERISK_ARI_USERNAME}
      CODECS: ${ASTERISK_CODECS}
      DTMF_MODE: ${ASTERISK_DTMF_MODE}
      RTP_PORT_END: ${ASTERISK_RTP_PORT_END}
      RTP_PORT_START: ${ASTERISK_RTP_PORT_START}
      SIPPROXY_HOST: ${ASTERISK_SIPPROXY_HOST}
      SIPPROXY_PORT: ${ASTERISK_SIPPROXY_PORT}
      SIPPROXY_SECRET: ${ASTERISK_SIPPROXY_SECRET}
      SIPPROXY_USERNAME: ${ASTERISK_SIPPROXY_USERNAME}
      # The Optimiq contexts in extensions.conf read these with ${ENV(...)}, so
      # no tenant id is baked into a file in version control. Leaving
      # OPTIMIQ_DEV_ORG_ID unset makes the engine REJECT inbound calls with
      # INVALID_PROFILE, which is correct for a box nobody has assigned.
      OPTIMIQ_ARI_APP: ${ENGINE_ARI_APP:-optimiq-engine}
      OPTIMIQ_DEV_ORG_ID: ${OPTIMIQ_DEV_ORG_ID:-}
      # Static SIP credentials for two demo extensions. Off unless set to
      # `true`; see apps/asterisk/config/pjsip_dev_endpoints.conf.
      OPTIMIQ_DEV_ENDPOINTS: ${OPTIMIQ_DEV_ENDPOINTS:-false}
    expose:
      - 6060

  # The Optimiq Voice call engine: ARI-driven channel orchestration, the routing
  # artifact walker, typed NATS call events and per-leg CDR emission.
  #
  # It deliberately has no `depends_on: service_healthy`. The engine is built to
  # come up against a broker and a media server that are not ready yet — the ARI
  # socket reconnects, the routing-cache watch retries with backoff, and
  # `/healthz` reports `degraded` in the meantime. Gating startup would only
  # move the failure from a log line to a deploy that never finishes.
  engine:
    image: optimiq-voice/engine:0.1.0
    restart: unless-stopped
    environment:
      ARI_URL: ${ENGINE_ARI_URL:-http://asterisk:8088}
      ARI_USERNAME: ${ASTERISK_ARI_USERNAME}
      ARI_PASSWORD: ${ASTERISK_ARI_SECRET}
      ARI_APP: ${ENGINE_ARI_APP:-optimiq-engine}
      NATS_URL: ${ENGINE_NATS_URL:-nats://nats:4222}
      ENGINE_PORT: ${ENGINE_PORT:-4010}
      ENGINE_ROUTING_ENABLED: ${ENGINE_ROUTING_ENABLED:-true}
      # Single-tenant development only. In production this is unset and an
      # unattributable call is rejected rather than filed under a guess.
      ENGINE_DEFAULT_ORGANIZATION_ID: ${OPTIMIQ_DEV_ORG_ID:-}
      ENGINE_EXTENSION_DIAL_TEMPLATE: ${ENGINE_EXTENSION_DIAL_TEMPLATE:-PJSIP/{number}}
      ENGINE_TRUNK_DIAL_TEMPLATE: ${ENGINE_TRUNK_DIAL_TEMPLATE:-PJSIP/{number}@{trunk}}
      LOGS_FORMAT: ${ENGINE_LOGS_FORMAT:-}
      LOGS_LEVEL: ${ENGINE_LOGS_LEVEL:-}
    expose:
      - 4010

  postgres:
    image: postgres:16.10-alpine3.22
    restart: unless-stopped
    environment:
      PGTZ: UTC
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      TZ: UTC
    expose:
      - 5432
    volumes:
      - db:/var/lib/postgresql/data

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    expose:
      - 8086
    environment:
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_TOKEN}
      DOCKER_INFLUXDB_INIT_BUCKET: calls
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME}
    volumes:
      - influxdb:/var/lib/influxdb2

  # `-js` enables JetStream, which is NOT the image's default. Without it the
  # engine cannot apply its stream/KV definitions at boot, the `channels` and
  # `routing-cache` buckets do not exist, and every `cdr.leg.write` is refused —
  # so the flag is load-bearing rather than an optimisation. Core pub/sub (which
  # is all `routr` uses) is unaffected by turning it on.
  nats:
    image: nats:2.11.8
    restart: unless-stopped
    command: ["-js", "--store_dir", "/data"]
    volumes:
      - nats:/data
    expose:
      - 4222

  envoy:
    image: envoyproxy/envoy:v1.35.0
    restart: unless-stopped
    volumes:
      - ./config/envoy.yaml:/etc/envoy/envoy.yaml:ro
      # If using letsencrypt, you need to mount the letsencrypt directory
      # by uncommenting the following line and changing the domain name to match your domain.
      #
      # Symbolic links will not work here!!!
      #
      # - ./path/to/letsencrypt:/etc/letsencrypt:ro
    ports:
      - 8449:8449
      # If using letsencrypt, you need to expose port 443 and remove the default HTTP port (8449)
      # - 443:443

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  db:
  influxdb:
  nats:
