name: optimiq-voice

services:
  # The admin frontend — Next.js 16 app router, shipped as a standalone server.
  #
  # It replaces the `dashboard` service, which is no longer shipped by either compose file. That
  # app's source and Dockerfile are untouched and still build on their own; nothing in the stack
  # references them any more.
  #
  # The browser only ever talks to THIS origin: `/api/auth/*` and `/api/v1/*` are rewritten
  # server-side to the API's HTTP bridge, which is what keeps the better-auth session cookie
  # first-party — no CORS preflight, no `SameSite=None`, nothing for a browser to block.
  #
  # That rewrite destination is baked at BUILD time (Next evaluates `rewrites()` during
  # `next build`), so `API_PROXY_ORIGIN` is a build argument and NOT an environment entry here.
  # The image defaults it to `http://api:9876` — this service, this network. Pointing a running
  # container somewhere else means rebuilding it; see apps/web/Dockerfile.
  web:
    image: optimiq-voice/web:0.1.0
    restart: unless-stopped
    # Published, not merely exposed: this is now the stack's ingress.
    #
    # `envoy` used to be the only service with a host port, terminating on 8449 and splitting
    # `/api/*` off to the API's gRPC-web and HTTP bridges. It is gone, and nothing replaced it,
    # because nothing needs to: this app's `next.config` rewrites `/api/auth/*` and `/api/v1/*`
    # server-side to `API_PROXY_ORIGIN` (default `http://api:9876`, this network), so the browser
    # only ever speaks to this origin and the session cookie stays first-party either way. A second
    # reverse proxy in front of a server that already reverse-proxies was one more place for the
    # cookie domain and the CORS story to disagree.
    ports:
      - ${WEB_PORT:-3100}:3100
    environment:
      # The only genuine runtime knob. Everything else the app reads is either compiled in or
      # proxied to `api`, which owns the database, the auth secret and the mail transport.
      PORT: ${WEB_PORT:-3100}

  api:
    image: optimiq-voice/api:0.17.1
    restart: unless-stopped
    # Only what the process still reads, and now ALL of it.
    #
    # Until this wave the list was a subset: it carried the auth slice's database but not its
    # secret, and neither telephony database at all, so a stack started from the shipped file came
    # up as an HTTP server with no authentication and no PBX, CDR, live, provisioning or media
    # surface — every one of which `main.ts` mounts only when its own variable is present. The
    # areas gate themselves silently by design (`isAuthSliceConfigured`, `isPbxAreaEnabled`,
    # `isCdrAreaEnabled`), which is right for a deployment that means it and wrong for the file
    # that is supposed to describe the whole platform.
    environment:
      # The public origin. `src/auth/auth.config.ts` uses it as better-auth's `baseURL` and
      # `src/mail/mail-env.ts` falls back to it for the links in verification, password-reset,
      # invitation and voicemail mail.
      - API_APP_URL
      #
      # --- The auth slice: all three, or none of it mounts --------------------------------------
      #
      # `isAuthSliceConfigured()` is `DATABASE_URL && AUTH_SECRET && AUTH_URL`, and the PBX and CDR
      # areas are gated on the auth slice in turn — their routes are `@RequirePermissions`-guarded
      # and the guard comes from it. So a missing AUTH_SECRET does not degrade authentication, it
      # removes the entire product surface.
      #
      # The base database. `packages/config` maps `API_DATABASE_URL` onto the canonical
      # `DATABASE_URL`; better-auth's tables (`packages/db`) live here.
      - API_DATABASE_URL
      # Signs every session cookie and every one-time link. `openssl rand -base64 32`; at least 32
      # characters, and production refuses to boot on the `.env.example` placeholder.
      - AUTH_SECRET
      # The public origin better-auth signs cookies and builds callback URLs against. Production
      # requires it to be HTTPS. It is the browser-facing origin — `web`, not `api`.
      - AUTH_URL
      #
      # --- The telephony areas ------------------------------------------------------------------
      #
      # Separate databases from the base one, deliberately (plan §3.3). `PBX_DATABASE_URL` mounts
      # extensions, ring groups, IVRs, queues, voicemail, routing, the media library and device
      # provisioning; `CDR_DATABASE_URL` mounts call reporting and recording playback.
      - PBX_DATABASE_URL
      - CDR_DATABASE_URL
      #
      # --- The broker --------------------------------------------------------------------------
      #
      # BOTH names, and that is not redundancy. `API_NATS_URL` is the transitional alias
      # `packages/config` maps onto `NATS_URL` for anything reading through that package — but the
      # PBX and CDR areas parse `process.env` directly at their own boundary and read the
      # unprefixed name, and `cdr-env.ts` requires it. With only the prefixed name set, the CDR
      # area fails its schema at boot and the PBX area silently skips the routing-cache publish and
      # the `rpc.routing.v1.resolve` responder.
      - API_NATS_URL
      - NATS_URL
      # The broker requires authentication (see the `nats` service and config/nats.conf).
      # These are the canonical, unprefixed names every platform service reads.
      - NATS_USER
      - NATS_PASS
      #
      # --- Media ---------------------------------------------------------------------------------
      #
      # One object store, mounted once. `CDR_RECORDING_ROOT` is the root the PBX area's voicemail
      # media and media library both inherit (`PBX_VOICEMAIL_MEDIA_ROOT`, `PBX_MEDIA_OBJECT_ROOT`),
      # and it must name the same directory `apps/engine` writes into and Asterisk reads back as
      # `ENGINE_MEDIA_OBJECT_ROOT` — an upload written anywhere else is a prompt that has a row, a
      # working preview in the admin UI, and silence on the call.
      - CDR_RECORDING_ROOT
      # Signs recording and voicemail playback URLs. Optional: without it the LISTS still work and
      # minting a playback URL fails with a named error rather than falling back to an unsigned
      # route. There is no default and there never will be one.
      - CDR_RECORDING_URL_SECRET
      #
      # Mail. `src/mail/mail-env.ts` reads the `MAIL_*` names first and these as the aliases.
      - API_SMTP_AUTH_PASS
      - API_SMTP_AUTH_USER
      - API_SMTP_HOST
      - API_SMTP_PORT
      - API_SMTP_SECURE
      - API_SMTP_SENDER
      #
      # Removed with the code that read them — each verified to have no reader left in apps/api:
      #
      #   API_ASTERISK_ARI_*        src/voice's ARI application (deleted; apps/engine owns ARI)
      #   API_AUTHZ_SERVICE_*       src/voice/client/AuthorizationHandler (deleted)
      #   API_CLOAK_ENCRYPTION_KEY  src/core/db.ts's field encryption, then the one-shot identity
      #                             migration scripts. Both deleted; nothing decrypts a cloaked
      #                             value anywhere in this repository.
      #   API_IDENTITY_*            the identity service and its invite controller (deleted)
      #   API_INFLUXDB_*            src/calls' metrics writer (deleted, with InfluxDB itself)
      #   API_LOGS_*                the deleted logger package (replaced by @optimiq-voice/logging,
      #                             which reads LOG_LEVEL / LOG_PRETTY)
      #   API_OWNER_*               src/core/seed.ts's default owner (deleted; sign-up is
      #                             better-auth's)
      #   API_ROOT_DOMAIN           had no reader in this app even before this change
      #   API_ROUTR_*               Routr provisioning (deleted, with Routr itself)
      #   API_SIGNALING_SERVER      src/core/testTokenConfig.ts (deleted)
      #   API_TWILIO_*              the identity service's 2FA / contact verification (deleted)
    expose:
      # The HTTP bridge, and now the only listener this process has: /api/auth/* and /api/v1/*.
      # `web` rewrites to it, in-network, which is why it is `expose` and not `ports`.
      #
      # The legacy gRPC listener on 50051 is gone. It terminated plaintext h2c, fronted the
      # identity/sipnet/applications/secrets/calls handlers, and its auth interceptor verified a
      # token the same process signed — so anything that could reach it could be told about
      # credentials. Its two callers went with it: `envoy`'s `api-cluster` (service deleted) and
      # `autopilot` (`AUTOPILOT_API_ENDPOINT`, service deleted).
      - 9876
    # No volumes.
    #
    # `./.keys:/opt/optimiq-voice/keys:ro` mounted the RSA keypair that `src/envs.ts` read at
    # import time to sign identity tokens. Nothing in this process signs RS256 any more — call
    # tokens are minted and verified through better-auth's JWKS — so the mount named a file the
    # image no longer opens.
    #
    # `./config/integrations.json:/opt/optimiq-voice/integrations.json:ro` (API_INTEGRATIONS_FILE)
    # carried the STT/TTS vendor credentials for the deleted `src/voice` ARI application. Speech
    # integration returns with the AI-agent app, on its own configuration surface.

  asterisk:
    image: optimiq-voice/asterisk:22
    restart: unless-stopped
    environment:
      ARI_PROXY_URL: ${ASTERISK_ARI_PROXY_URL}
      ARI_SECRET: ${ASTERISK_ARI_SECRET}
      ARI_USERNAME: ${ASTERISK_ARI_USERNAME}
      CODECS: ${ASTERISK_CODECS}
      DTMF_MODE: ${ASTERISK_DTMF_MODE}
      RTP_PORT_END: ${ASTERISK_RTP_PORT_END}
      RTP_PORT_START: ${ASTERISK_RTP_PORT_START}
      SIPPROXY_HOST: ${ASTERISK_SIPPROXY_HOST}
      SIPPROXY_PORT: ${ASTERISK_SIPPROXY_PORT}
      SIPPROXY_SECRET: ${ASTERISK_SIPPROXY_SECRET}
      SIPPROXY_USERNAME: ${ASTERISK_SIPPROXY_USERNAME}
      # The Optimiq contexts in extensions.conf read these with ${ENV(...)}, so
      # no tenant id is baked into a file in version control. Leaving
      # OPTIMIQ_DEV_ORG_ID unset makes the engine REJECT inbound calls with
      # INVALID_PROFILE, which is correct for a box nobody has assigned.
      OPTIMIQ_ARI_APP: ${ENGINE_ARI_APP:-optimiq-engine}
      OPTIMIQ_DEV_ORG_ID: ${OPTIMIQ_DEV_ORG_ID:-}
      # Static SIP credentials for two demo extensions. Off unless set to
      # `true`; see apps/asterisk/config/pjsip_dev_endpoints.conf.
      OPTIMIQ_DEV_ENDPOINTS: ${OPTIMIQ_DEV_ENDPOINTS:-false}
    expose:
      - 6060

  # The Optimiq Voice call engine: ARI-driven channel orchestration, the routing
  # artifact walker, typed NATS call events and per-leg CDR emission.
  #
  # It deliberately has no `depends_on: service_healthy`. The engine is built to
  # come up against a broker and a media server that are not ready yet — the ARI
  # socket reconnects, the routing-cache watch retries with backoff, and
  # `/healthz` reports `degraded` in the meantime. Gating startup would only
  # move the failure from a log line to a deploy that never finishes.
  engine:
    image: optimiq-voice/engine:0.1.0
    restart: unless-stopped
    environment:
      ARI_URL: ${ENGINE_ARI_URL:-http://asterisk:8088}
      ARI_USERNAME: ${ASTERISK_ARI_USERNAME}
      ARI_PASSWORD: ${ASTERISK_ARI_SECRET}
      ARI_APP: ${ENGINE_ARI_APP:-optimiq-engine}
      NATS_URL: ${ENGINE_NATS_URL:-nats://nats:4222}
      NATS_USER: ${NATS_USER}
      NATS_PASS: ${NATS_PASS}
      ENGINE_PORT: ${ENGINE_PORT:-4010}
      ENGINE_ROUTING_ENABLED: ${ENGINE_ROUTING_ENABLED:-true}
      # Single-tenant development only. In production this is unset and an
      # unattributable call is rejected rather than filed under a guess.
      ENGINE_DEFAULT_ORGANIZATION_ID: ${OPTIMIQ_DEV_ORG_ID:-}
      ENGINE_EXTENSION_DIAL_TEMPLATE: ${ENGINE_EXTENSION_DIAL_TEMPLATE:-PJSIP/{number}}
      ENGINE_TRUNK_DIAL_TEMPLATE: ${ENGINE_TRUNK_DIAL_TEMPLATE:-PJSIP/{number}@{trunk}}
      LOGS_FORMAT: ${ENGINE_LOGS_FORMAT:-}
      LOGS_LEVEL: ${ENGINE_LOGS_LEVEL:-}
    expose:
      - 4010

  postgres:
    image: postgres:16.10-alpine3.22
    restart: unless-stopped
    environment:
      PGTZ: UTC
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      TZ: UTC
    expose:
      - 5432
    volumes:
      - db:/var/lib/postgresql/data

  # The platform backbone. It runs from `config/nats.conf` rather than command-line
  # flags because the flags cannot express authorization, and a config file and a
  # command line are not merged — so `-js --store_dir /data` moved into the file's
  # `jetstream` block along with the accounts.
  #
  # JetStream is still load-bearing rather than an optimisation: without it the
  # engine cannot apply its stream/KV definitions at boot, the `channels` and
  # `routing-cache` buckets do not exist, and every `cdr.leg.write` is refused.
  # Core pub/sub (which is all `routr` uses) is unaffected by having it on.
  #
  # The four credentials below are resolved by nats-server itself out of this
  # container's environment, so no password appears in this file. Leave any of them
  # unset and the broker REFUSES TO START ("variable reference ... can not be
  # found") instead of coming up open, which is the point.
  nats:
    image: nats:2.11.8
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      - NATS_USER
      - NATS_PASS
      - NATS_SYS_USER
      - NATS_SYS_PASS
    volumes:
      - ./config/nats.conf:/etc/nats/nats.conf:ro
      - nats:/data
    expose:
      - 4222

  # Four services are gone from this file and are NOT coming back under these names.
  #
  # `envoy` was the stack's TLS terminator and edge router on 8449: `/optimiq_voice.*` to the API's
  # gRPC-web listener, `/api/*` to its HTTP bridge, everything else to the dashboard. All three
  # destinations are gone. `web` proxies `/api/auth/*` and `/api/v1/*` to `api:9876` from its own
  # Next server, which is what keeps the better-auth session cookie first-party; a second proxy in
  # front of that only added a place for the cookie domain and the CORS story to disagree. A
  # deployment that wants TLS terminates it in front of `web` (see its `ports` above).
  #
  # `routr` and `rtpengine` were the SIP edge and the media relay of the legacy call path.
  # `apps/sipd` is the SIP edge now, and it derives its credentials over `rpc.sip.v1.credential`
  # from the broker rather than from a Routr database. Their ports (5060-5063, 51907-51908,
  # 10000-10100/udp) are no longer published by anything in this file.
  #
  # `influxdb` held the legacy `calls` bucket that `src/calls`' metrics writer wrote to. Call
  # records live in PostgreSQL now — `packages/cdr-db`, partitioned, tenant-scoped by RLS and
  # queryable by the CDR area. The bucket was dropped without a backfill: nothing reads it.
  #
  # `autoheal` existed for one reason — `routr` crashed and needed restarting — and it was given
  # the Docker socket to do it. A container with `/var/run/docker.sock` can start any container on
  # the host as root; that is a very large capability to hold for a workaround to a service that no
  # longer exists.

volumes:
  db:
  nats:
